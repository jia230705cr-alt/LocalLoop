<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meet Cloudy | Cloud & Stories Bristol</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              cream: '#FFF9F2',
              'cream-card': '#FFFFFF',
              coral: '#FF9B85',
              'coral-hover': '#EE856E',
              'mint-blue': '#A2D5C6',
              'mint-hover': '#8EC4B5',
              'warm-yellow': '#FFE699',
              'soft-purple': '#E0BBE4',
              'soft-pink': '#FFDFD3',
              'soft-gray': '#F2EDE4',
              'charcoal': '#3A3330',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0px)' },
                '50%': { transform: 'translateY(-10px)' },
              },
              pulseGlow: {
                '0%, 100%': { opacity: '1', transform: 'scale(1)' },
                '50%': { opacity: '0.7', transform: 'scale(1.18)' },
              }
            },
            animation: {
              float: 'float 3.5s ease-in-out infinite',
              pulseGlow: 'pulseGlow 2s ease-in-out infinite',
            }
          }
        }
      }
    </script>
    <!-- React, ReactDOM & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #FFF9F2; color: #3A3330; }
        .k-card-shadow { box-shadow: 0 14px 40px -10px rgba(58, 51, 48, 0.06); }
        .k-soft-glow { box-shadow: 0 10px 25px rgba(255, 155, 133, 0.25); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // Corrected Cloudy IP Mascot SVG (Wings positioned correctly behind body sides)
        function CloudyMascotSVG({ className = "w-40 h-40" }) {
            return (
                <svg className={className} viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
                    {/* Left Cloud Wing */}
                    <g transform="translate(8, 100)">
                        <path d="M 20 20 C 10 20, 5 10, 15 0 C 25 -10, 40 0, 45 10 C 50 10, 55 25, 40 30 C 30 35, 20 30, 20 20 Z" fill="#FFFFFF" stroke="#A2D5C6" strokeWidth="3.5"/>
                    </g>

                    {/* Right Cloud Wing */}
                    <g transform="translate(148, 100) scale(-1, 1)">
                        <path d="M 20 20 C 10 20, 5 10, 15 0 C 25 -10, 40 0, 45 10 C 50 10, 55 25, 40 30 C 30 35, 20 30, 20 20 Z" fill="#FFFFFF" stroke="#A2D5C6" strokeWidth="3.5"/>
                    </g>

                    {/* Body */}
                    <ellipse cx="100" cy="118" rx="52" ry="46" fill="#FFFDF9" stroke="#E5DEC9" strokeWidth="3"/>
                    
                    {/* Facial Features */}
                    <circle cx="82" cy="104" r="5" fill="#3A3330"/>
                    <circle cx="118" cy="104" r="5" fill="#3A3330"/>
                    <ellipse cx="72" cy="114" rx="7" ry="4" fill="#FFAAA6" opacity="0.8"/>
                    <ellipse cx="128" cy="114" rx="7" ry="4" fill="#FFAAA6" opacity="0.8"/>
                    <path d="M 96 110 Q 100 116 104 110 Z" fill="#F7B267"/>

                    {/* Red Beret */}
                    <path d="M 65 78 C 65 58, 135 58, 135 78 Z" fill="#FF9B85"/>
                    <ellipse cx="100" cy="78" rx="38" ry="8" fill="#EE856E"/>
                    <circle cx="100" cy="55" r="5" fill="#FFE699"/>

                    {/* Yellow Satchel */}
                    <path d="M 75 110 Q 100 145 125 125" stroke="#FFE699" strokeWidth="3.5" fill="none" strokeDasharray="3 2"/>
                    <rect x="115" y="122" width="18" height="15" rx="4" fill="#FFE699" stroke="#F7B267" strokeWidth="2"/>
                    <circle cx="124" cy="129" r="2" fill="#3A3330"/>

                    {/* Feet */}
                    <ellipse cx="85" cy="164" rx="8" ry="4" fill="#F7B267"/>
                    <ellipse cx="115" cy="164" rx="8" ry="4" fill="#F7B267"/>
                </svg>
            );
        }

        function CloudyLogoIcon() {
            return (
                <div className="w-10 h-10 rounded-2xl bg-soft-pink/40 border border-coral/30 flex items-center justify-center p-1 shadow-sm overflow-hidden">
                    <CloudyMascotSVG className="w-9 h-9" />
                </div>
            );
        }

        const initialExperiences = [
            {
                id: 'exp1',
                title: 'St Nicholas Market Food & Heritage Tasting Tour',
                titleZh: '圣尼古拉斯集市：传统黑胶音乐与英国美食体验局',
                categoryZh: 'Food & Heritage',
                price: 25,
                locationZh: 'Old City • St Nicholas Market',
                bgColor: 'bg-soft-purple/20',
                tagColor: 'bg-soft-purple/50 text-charcoal',
                image: 'https://images.unsplash.com/photo-1555396273-367ea4eb4db5?auto=format&fit=crop&w=800&q=80'
            },
            {
                id: 'exp2',
                title: 'Street Art & Banksy Spray Painting Workshop',
                titleZh: '布里斯托街头艺术：班克西风格涂鸦创作体验局',
                categoryZh: 'Street Art',
                price: 35,
                locationZh: 'Stokes Croft • Cultural Quarter',
                bgColor: 'bg-warm-yellow/30',
                tagColor: 'bg-warm-yellow text-charcoal',
                image: 'https://images.unsplash.com/photo-1561055657-b9e0bf0fa360?auto=format&fit=crop&w=800&q=80'
            },
            {
                id: 'exp3',
                title: 'Clifton Suspension Bridge Sunset Picnic Walk',
                titleZh: '克里夫顿吊桥：夕阳野餐与摄影走廊局',
                categoryZh: 'City Walk',
                price: 20,
                locationZh: 'Clifton Village',
                bgColor: 'bg-mint-blue/20',
                tagColor: 'bg-mint-blue/50 text-charcoal',
                image: 'https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=800&q=80'
            }
        ];

        const extraExperiences = [
            {
                id: 'exp4',
                title: 'Harbourside Stand-Up Paddleboarding & Sunset',
                titleZh: '海港水上划桨与落日调酒体验局',
                categoryZh: 'Harbourside Activity',
                price: 30,
                locationZh: 'Bristol Harbourside',
                bgColor: 'bg-soft-pink/30',
                tagColor: 'bg-coral text-white',
                image: 'https://images.unsplash.com/photo-1544551763-46a013bb70d5?auto=format&fit=crop&w=800&q=80'
            },
            {
                id: 'exp5',
                title: 'Artisanal Pottery & Clay Crafting in Bedminster',
                titleZh: '贝德敏斯特手艺人：陶艺拉胚与彩绘体验局',
                categoryZh: 'Arts & Crafts',
                price: 32,
                locationZh: 'Bedminster • Southville',
                bgColor: 'bg-warm-yellow/20',
                tagColor: 'bg-warm-yellow text-charcoal',
                image: 'https://images.unsplash.com/photo-1565193566173-7a0ee3dbe261?auto=format&fit=crop&w=800&q=80'
            },
            {
                id: 'exp6',
                title: 'Independent Coffee Tasting & Bakery Tour',
                titleZh: '独立咖啡馆盲测与正宗英式烘焙探店局',
                categoryZh: 'Food Experience',
                price: 18,
                locationZh: 'Gloucester Road',
                bgColor: 'bg-mint-blue/30',
                tagColor: 'bg-mint-blue/60 text-charcoal',
                image: 'https://images.unsplash.com/photo-1509042239860-f550ce710b93?auto=format&fit=crop&w=800&q=80'
            }
        ];

        function CloudLoopApp() {
            const [lang, setLang] = useState('en'); // Default to English
            const [currentCity, setCurrentCity] = useState('Bristol, UK');
            const [showCityDropdown, setShowCityDropdown] = useState(false);
            const [experiencesList, setExperiencesList] = useState(initialExperiences);
            const [hasLoadedMore, setHasLoadedMore] = useState(false);
            const [selectedExp, setSelectedExp] = useState(null);
            const [bookingSuccess, setBookingSuccess] = useState(false);
            const [showAuthModal, setShowAuthModal] = useState(false);
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [activeMapPin, setActiveMapPin] = useState('clifton');

            const citiesList = [
                { name: 'Bristol, UK', active: true },
                { name: 'Bath, UK', active: false },
                { name: 'London, UK', active: false },
                { name: 'Edinburgh, UK', active: false },
            ];

            const scrollToSection = (id) => {
                const element = document.getElementById(id);
                if (element) {
                    element.scrollIntoView({ behavior: 'smooth' });
                }
            };

            const handleLoadMore = () => {
                if (!hasLoadedMore) {
                    setExperiencesList([...experiencesList, ...extraExperiences]);
                    setHasLoadedMore(true);
                } else {
                    alert('All featured Bristol experiences are currently loaded!');
                }
            };

            return (
                <div className="min-h-screen flex flex-col justify-between selection:bg-coral/20 relative">
                    {/* 1. Navbar */}
                    <header className="sticky top-0 z-50 bg-cream/90 backdrop-blur-md border-b border-soft-gray px-4 lg:px-8 py-3.5 flex items-center justify-between">
                        <div className="flex items-center space-x-4">
                            <div className="flex items-center space-x-2.5 cursor-pointer" onClick={() => window.scrollTo({top: 0, behavior: 'smooth'})}>
                                <CloudyLogoIcon />
                                <div>
                                    <span className="text-lg font-extrabold tracking-tight text-charcoal leading-none block">
                                        Cloud & Stories <span className="text-coral text-xs font-semibold uppercase tracking-wider ml-1">Bristol</span>
                                    </span>
                                </div>
                            </div>

                            {/* Location Selector Dropdown */}
                            <div className="relative border-l border-soft-gray pl-4 hidden sm:block">
                                <button 
                                    onClick={() => setShowCityDropdown(!showCityDropdown)}
                                    className="bg-white px-3.5 py-1.5 rounded-full border border-soft-pink text-xs font-bold text-charcoal flex items-center space-x-1.5 hover:border-coral transition shadow-sm"
                                >
                                    <i className="fa-solid fa-location-dot text-coral text-xs"></i>
                                    <span>{currentCity}</span>
                                    <i className={`fa-solid fa-chevron-down text-[10px] text-charcoal/40 ml-1 transition-transform ${showCityDropdown ? 'rotate-180' : ''}`}></i>
                                </button>

                                {showCityDropdown && (
                                    <div className="absolute top-full left-4 mt-2 w-44 bg-white rounded-2xl border border-soft-gray shadow-xl py-2 z-50 text-xs font-medium">
                                        <div className="px-3 py-1 text-[10px] text-charcoal/40 font-bold uppercase tracking-wider">Select City</div>
                                        {citiesList.map((c, index) => (
                                            <button
                                                key={index}
                                                onClick={() => {
                                                    setCurrentCity(c.name);
                                                    setShowCityDropdown(false);
                                                }}
                                                className={`w-full text-left px-3.5 py-2 hover:bg-cream flex justify-between items-center ${c.name === currentCity ? 'text-coral font-bold bg-soft-pink/20' : 'text-charcoal'}`}
                                            >
                                                <span>{c.name}</span>
                                                {c.name === currentCity && <i className="fa-solid fa-check text-[10px]"></i>}
                                            </button>
                                        ))}
                                    </div>
                                )}
                            </div>
                        </div>

                        {/* Navigation Items */}
                        <nav className="hidden md:flex items-center space-x-7 text-xs font-bold text-charcoal/75 tracking-wide">
                            <button onClick={() => scrollToSection('experience-hub')} className="hover:text-coral transition">
                                ⛩️ {lang === 'en' ? 'Experiences' : '精选局'}
                            </button>
                            <button onClick={() => scrollToSection('city-explorer')} className="hover:text-coral transition">
                                🗺️ {lang === 'en' ? 'Map' : '手绘地图'}
                            </button>
                            <button onClick={() => scrollToSection('community-section')} className="hover:text-coral transition">
                                💬 {lang === 'en' ? 'Community' : '社群局'}
                            </button>
                            <button onClick={() => scrollToSection('cloudy-story')} className="hover:text-coral transition">
                                🕊️ {lang === 'en' ? 'Story' : 'Cloudy的日记'}
                            </button>
                        </nav>

                        {/* Language & User Controls */}
                        <div className="flex items-center space-x-3">
                            <button 
                                onClick={() => setLang(lang === 'en' ? 'zh' : 'en')}
                                className="px-3.5 py-1.5 rounded-full border border-soft-purple/40 bg-white text-xs font-bold text-charcoal hover:border-coral transition shadow-sm"
                            >
                                {lang === 'en' ? 'EN / 中文' : '中文 / EN'}
                            </button>

                            <button 
                                onClick={() => setIsLoggedIn(!isLoggedIn)}
                                className={`text-xs font-bold px-4 py-2 rounded-full shadow-sm transition flex items-center space-x-1.5 ${
                                    isLoggedIn ? 'bg-mint-blue/30 text-charcoal' : 'bg-coral text-white hover:bg-coral-hover k-soft-glow'
                                }`}
                            >
                                <i className="fa-regular fa-user"></i>
                                <span>{isLoggedIn ? (lang === 'en' ? 'Account' : '我的账号') : (lang === 'en' ? 'Sign In' : '登录 / 注册')}</span>
                            </button>
                        </div>
                    </header>

                    {/* 2. Hero Section */}
                    <section className="max-w-6xl mx-auto px-4 pt-6 pb-6 w-full">
                        <div className="bg-gradient-to-br from-white via-soft-pink/30 to-mint-blue/20 rounded-4xl p-8 lg:p-12 border border-soft-pink/40 k-card-shadow flex flex-col md:flex-row items-center justify-between gap-8 relative overflow-hidden">
                            <div className="md:w-7/12 space-y-5 z-10">
                                <div className="inline-flex items-center space-x-2 bg-white/80 text-coral text-xs font-bold px-4 py-1.5 rounded-full border border-soft-pink shadow-sm">
                                    <span>🌸 Walk slowly to discover hidden city wonders</span>
                                </div>
                                <h1 className="text-3xl lg:text-5xl font-extrabold text-charcoal leading-tight tracking-tight">
                                    {lang === 'en' ? (
                                        <>Follow the Clouds,<br/><span className="text-coral">Find Bristol's Secrets.</span></>
                                    ) : (
                                        <>跟着云朵走，<br/><span className="text-coral">发现布里斯托的小惊喜。</span></>
                                    )}
                                </h1>
                                <p className="text-charcoal/70 text-xs lg:text-sm leading-relaxed max-w-md">
                                    {lang === 'en' 
                                        ? '“Travel isn’t about rushing; it’s about listening to the city flourish.” Join Cloudy to explore Clifton Bridge, Banksy murals, and indie Harbourside walks.' 
                                        : '“旅行不是赶路，是听一座城市开花的声音。” 跟着 Cloudy 探索克里夫顿吊桥、班克西涂鸦与布里斯托海港。'}
                                </p>

                                <div className="pt-2">
                                    <div className="flex bg-white/90 p-1.5 rounded-2xl border border-soft-pink max-w-lg shadow-sm">
                                        <div className="flex items-center pl-3.5 text-charcoal/40">
                                            <i className="fa-solid fa-magnifying-glass text-xs"></i>
                                        </div>
                                        <input 
                                            type="text" 
                                            placeholder={lang === 'en' ? "Search: Street art, Clifton, Harbourside tea..." : "搜索：涂鸦艺术、克里夫顿吊桥、海港咖啡..."}
                                            className="w-full bg-transparent px-3 py-2 text-xs font-medium focus:outline-none text-charcoal placeholder-charcoal/40"
                                        />
                                        <button 
                                            onClick={() => scrollToSection('experience-hub')}
                                            className="bg-coral text-white font-bold px-5 py-2.5 rounded-xl text-xs hover:bg-coral-hover transition shadow-sm whitespace-nowrap"
                                        >
                                            {lang === 'en' ? 'Explore' : '探索体验'}
                                        </button>
                                    </div>
                                </div>
                            </div>

                            {/* Animated Mascot */}
                            <div className="md:w-5/12 flex flex-col items-center justify-center relative">
                                <div className="w-72 h-72 bg-gradient-to-tr from-warm-yellow/30 to-mint-blue/30 rounded-full flex flex-col items-center justify-center border-2 border-dashed border-white p-6 text-center relative shadow-inner animate-float">
                                    <CloudyMascotSVG className="w-48 h-48 drop-shadow-md" />
                                    <div className="absolute -bottom-2 bg-white text-charcoal border border-soft-pink px-4 py-2 rounded-2xl shadow-md text-xs font-bold text-center">
                                        ✨ <span className="text-coral">Cloudy's Tip:</span> “Let’s grab tea at St Nick's!”
                                    </div>
                                </div>
                            </div>
                        </div>
                    </section>

                    {/* 3. Welcome Banner */}
                    <section className="max-w-6xl mx-auto px-4 py-3 w-full">
                        <div className="bg-gradient-to-r from-mint-blue/30 via-warm-yellow/20 to-soft-purple/30 border border-mint-blue/40 rounded-3xl p-6 flex flex-col md:flex-row items-center justify-between gap-4 card-shadow">
                            <div className="flex items-center space-x-3">
                                <div className="w-12 h-12 bg-white rounded-2xl flex items-center justify-center text-2xl shadow-sm border border-mint-blue/30">
                                    🎁
                                </div>
                                <div>
                                    <h4 className="font-extrabold text-sm text-charcoal">{lang === 'en' ? 'Join Cloud & Stories Bristol' : '加入布里斯托云上有局'}</h4>
                                    <p className="text-xs text-charcoal/70 mt-0.5">{lang === 'en' ? 'Get a £10 welcome voucher + an exclusive Cloudy digital Bristol explorer badge.' : '新用户注册立享 £10 体验金 + 获得 Cloudy 限定布里斯托纪念徽章'}</p>
                                </div>
                            </div>
                            <button 
                                onClick={() => setShowAuthModal(true)}
                                className="bg-coral text-white font-bold px-6 py-2.5 rounded-full text-xs hover:bg-coral-hover transition shadow-sm whitespace-nowrap k-soft-glow"
                            >
                                {lang === 'en' ? 'Sign Up Free' : '免费注册领福利'}
                            </button>
                        </div>
                    </section>

                    {/* 4. Experience Hub */}
                    <section id="experience-hub" className="max-w-6xl mx-auto px-4 py-8 w-full space-y-6">
                        <div className="flex justify-between items-end border-b border-soft-gray pb-3">
                            <div>
                                <span className="text-[10px] font-bold text-coral uppercase tracking-wider block">Today's Picks</span>
                                <h2 className="text-2xl font-extrabold text-charcoal">{lang === 'en' ? '⛩️ Cloudy’s Featured Bristol Experiences' : '⛩️ 今日 Cloudy 独家私房推荐'}</h2>
                            </div>
                            <button onClick={handleLoadMore} className="text-xs font-bold text-coral hover:underline">
                                {lang === 'en' ? (hasLoadedMore ? 'All Experiences Loaded' : 'Load More (+3) →') : (hasLoadedMore ? '已展示全部活动' : '展开更多体验 (+3) →')}
                            </button>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6 transition-all duration-500">
                            {experiencesList.map((exp) => (
                                <div key={exp.id} className={`rounded-3xl overflow-hidden border border-soft-gray k-card-shadow hover:-translate-y-1.5 transition duration-300 flex flex-col justify-between ${exp.bgColor}`}>
                                    <div>
                                        <div className="relative">
                                            <img src={exp.image} alt={exp.title} className="w-full h-48 object-cover" />
                                            <span className={`absolute top-3 left-3 font-bold text-[10px] px-3 py-1 rounded-full shadow-sm ${exp.tagColor}`}>
                                                {exp.categoryZh}
                                            </span>
                                        </div>
                                        <div className="p-5 space-y-2">
                                            <div className="text-[10px] text-charcoal/50 font-medium">📍 {exp.locationZh}</div>
                                            <h3 className="font-bold text-sm text-charcoal line-clamp-2 leading-snug">
                                                {lang === 'en' ? exp.title : exp.titleZh}
                                            </h3>
                                        </div>
                                    </div>
                                    <div className="p-5 pt-0 flex justify-between items-center border-t border-black/5 mt-2">
                                        <div>
                                            <span className="text-[10px] text-charcoal/50 font-bold">GBP</span>
                                            <span className="text-lg font-extrabold text-coral ml-1">£{exp.price}</span>
                                        </div>
                                        <button 
                                            onClick={() => setSelectedExp(exp)}
                                            className="bg-charcoal text-cream px-4 py-2 rounded-xl text-xs font-bold hover:bg-coral transition shadow-sm"
                                        >
                                            {lang === 'en' ? 'Book' : '预约组局'}
                                        </button>
                                    </div>
                                </div>
                            ))}
                        </div>

                        {!hasLoadedMore && (
                            <div className="text-center pt-2">
                                <button 
                                    onClick={handleLoadMore}
                                    className="bg-white border border-soft-pink text-charcoal font-bold px-8 py-3 rounded-full text-xs hover:bg-soft-pink/30 transition shadow-sm"
                                >
                                    ✨ {lang === 'en' ? 'Load More Bristol Cultural Walks' : '点击加载更多布里斯托在地文化局'}
                                </button>
                            </div>
                        )}
                    </section>

                    {/* 5. Bristol Illustrated Map */}
                    <section id="city-explorer" className="max-w-6xl mx-auto px-4 py-8 w-full space-y-6">
                        <div className="border-b border-soft-gray pb-3">
                            <span className="text-[10px] font-bold text-mint-blue uppercase tracking-wider block">Illustrated Map</span>
                            <h2 className="text-2xl font-extrabold text-charcoal">{lang === 'en' ? '🗺️ Cloudy’s Bristol Discovery Map' : '🗺️ Cloudy 的布里斯托手绘漫游地图'}</h2>
                        </div>

                        <div className="bg-white rounded-4xl p-6 border border-soft-gray k-card-shadow flex flex-col lg:flex-row gap-6 items-center">
                            <div className="w-full lg:w-2/3 h-88 bg-gradient-to-br from-[#FFF8EE] via-[#FDF3E3] to-[#F5EAD6] rounded-3xl border-2 border-dashed border-[#E5DEC9] relative overflow-hidden flex items-center justify-center p-4">
                                <div className="absolute inset-0 opacity-15 bg-[radial-gradient(#3A3330_1px,transparent_1px)] [background-size:20px_20px]"></div>
                                
                                <span className="absolute top-4 left-4 z-10 bg-white/90 text-[10px] font-bold text-charcoal px-3 py-1 rounded-full border border-soft-pink shadow-sm">
                                    💡 {lang === 'en' ? 'Click pins for Cloudy’s local guide' : '点击手绘点位查看 Cloudy 私房指南'}
                                </span>

                                {/* River Avon Drawing */}
                                <svg className="absolute inset-0 w-full h-full pointer-events-none opacity-40">
                                    <path d="M 0 140 Q 200 240 380 140 T 600 200" fill="none" stroke="#B4CEE6" strokeWidth="18" strokeLinecap="round" />
                                    <path d="M 100 240 Q 250 100 480 170" fill="none" stroke="#FF9B85" strokeWidth="3" strokeDasharray="6 6" />
                                </svg>

                                <div className="absolute top-8 right-12 text-[10px] font-extrabold text-charcoal/30 tracking-widest pointer-events-none">
                                    BRISTOL CITY MAP
                                </div>
                                <div className="absolute bottom-6 left-8 text-lg opacity-40 pointer-events-none">
                                    🌉 🎨 ⛵ ☕
                                </div>

                                {/* Pin 1: Clifton Bridge */}
                                <div 
                                    className={`absolute top-1/3 left-1/4 cursor-pointer transform hover:scale-110 transition ${activeMapPin === 'clifton' ? 'z-20' : ''}`}
                                    onClick={() => setActiveMapPin('clifton')}
                                >
                                    <div className="relative">
                                        <span className="absolute -inset-1 rounded-full bg-coral animate-pulseGlow opacity-75"></span>
                                        <div className="relative bg-coral text-white text-xs px-3.5 py-1.5 rounded-full shadow-md font-bold flex items-center space-x-1">
                                            <span>🌉 Clifton Suspension Bridge</span>
                                        </div>
                                    </div>
                                </div>

                                {/* Pin 2: Harbourside */}
                                <div 
                                    className={`absolute bottom-1/3 right-1/3 cursor-pointer transform hover:scale-110 transition ${activeMapPin === 'harbourside' ? 'z-20' : ''}`}
                                    onClick={() => setActiveMapPin('harbourside')}
                                >
                                    <div className="relative">
                                        <span className="absolute -inset-1 rounded-full bg-warm-yellow animate-pulseGlow opacity-75"></span>
                                        <div className="relative bg-warm-yellow text-charcoal text-xs px-3.5 py-1.5 rounded-full shadow-md font-bold flex items-center space-x-1 border border-soft-gray">
                                            <span>⛵ St Nicholas & Harbourside</span>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            {/* Pin Details */}
                            <div className="w-full lg:w-1/3 space-y-4">
                                {activeMapPin === 'clifton' ? (
                                    <div className="bg-soft-pink/30 p-5 rounded-3xl border border-soft-pink space-y-3 transition-all duration-300">
                                        <span className="text-[10px] font-bold bg-coral text-white px-2.5 py-0.5 rounded-full">Cloudy Trail A</span>
                                        <h4 className="font-bold text-charcoal text-sm">【Clifton Village to Suspension Bridge】</h4>
                                        <p className="text-xs text-charcoal/70 leading-relaxed">A 2.5 km scenic stroll through Clifton Georgian lanes ending with sunset views over Avon Gorge.</p>
                                        <button onClick={() => alert('Navigating to Clifton Walk Guide!')} className="w-full bg-white text-charcoal border border-soft-pink font-bold py-2 rounded-xl text-xs hover:bg-coral hover:text-white transition">
                                            Start Walking Route
                                        </button>
                                    </div>
                                ) : (
                                    <div className="bg-warm-yellow/30 p-5 rounded-3xl border border-warm-yellow space-y-3 transition-all duration-300">
                                        <span className="text-[10px] font-bold bg-warm-yellow text-charcoal px-2.5 py-0.5 rounded-full border border-black/10">Cloudy Trail B</span>
                                        <h4 className="font-bold text-charcoal text-sm">【Harbourside & St Nicholas Food Walk】</h4>
                                        <p className="text-xs text-charcoal/70 leading-relaxed">Explore historic markets, independent cafes, and colourful docks along the River Avon.</p>
                                        <button onClick={() => alert('Navigating to Harbourside Food Walk Guide!')} className="w-full bg-white text-charcoal border border-warm-yellow font-bold py-2 rounded-xl text-xs hover:bg-warm-yellow transition">
                                            Start Walking Route
                                        </button>
                                    </div>
                                )}
                            </div>
                        </div>
                    </section>

                    {/* 6. Community Section */}
                    <section id="community-section" className="max-w-6xl mx-auto px-4 py-8 w-full space-y-6">
                        <div className="border-b border-soft-gray pb-3 flex justify-between items-end">
                            <div>
                                <span className="text-[10px] font-bold text-soft-purple uppercase tracking-wider block">Community & Meetups</span>
                                <h2 className="text-2xl font-extrabold text-charcoal">{lang === 'en' ? '💬 Bristol Local Stories & Meetups' : '💬 云上社区与线下组局'}</h2>
                            </div>
                            <button onClick={() => alert('Feature opening soon...')} className="text-xs font-bold text-coral hover:underline">
                                {lang === 'en' ? '+ Share Your Story' : '+ 发布我的私藏局'}
                            </button>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                            <div className="bg-white p-5 rounded-3xl border border-soft-gray k-card-shadow space-y-3">
                                <div className="flex items-center space-x-2.5 text-xs">
                                    <span className="w-8 h-8 rounded-full bg-mint-blue/30 flex items-center justify-center font-bold text-charcoal">A</span>
                                    <div>
                                        <div className="font-bold text-charcoal">Alex ( UK 🇬🇧 )</div>
                                        <div className="text-[10px] text-charcoal/40">Stokes Croft • 2h ago</div>
                                    </div>
                                </div>
                                <p className="text-xs text-charcoal/70 leading-relaxed">
                                    {lang === 'en' ? 'Found this hidden street art workshop thanks to Cloudy! Unlocked my first Bristol badge.' : '跟着 Cloudy 找到了这个涂鸦工坊，拿到了我的第一个布里斯托印章！'}
                                </p>
                            </div>

                            <div className="bg-white p-5 rounded-3xl border border-soft-gray k-card-shadow space-y-3">
                                <div className="flex items-center space-x-2.5 text-xs">
                                    <span className="w-8 h-8 rounded-full bg-soft-pink text-coral flex items-center justify-center font-bold">L</span>
                                    <div>
                                        <div className="font-bold text-charcoal">Lily ( Local Host 🇬🇧 )</div>
                                        <div className="text-[10px] text-charcoal/40">Clifton • Yesterday</div>
                                    </div>
                                </div>
                                <p className="text-xs text-charcoal/70 leading-relaxed">
                                    {lang === 'en' ? 'Weekend Sunset Picnic & Photography Walk is open for registration! Everyone is welcome.' : '本周末【克里夫顿落日野餐摄影局】开始报名啦！'}
                                </p>
                            </div>

                            <div className="bg-gradient-to-br from-soft-purple/20 to-soft-pink/30 p-5 rounded-3xl border border-soft-purple/30 k-card-shadow flex flex-col justify-between">
                                <div>
                                    <span className="text-[10px] font-bold bg-white text-charcoal px-3 py-1 rounded-full shadow-sm">
                                        🎉 Official Meetup
                                    </span>
                                    <h4 className="font-bold text-sm text-charcoal mt-3">{lang === 'en' ? 'Weekend Harbourside Gathering' : '周末 CloudLoop 海港相聚局'}</h4>
                                    <p className="text-xs text-charcoal/60 mt-1">Location: Harbourside Cultural Hub</p>
                                </div>
                                <button onClick={() => alert('Successfully registered for Bristol Meetup!')} className="w-full bg-coral text-white text-xs font-bold py-2.5 rounded-xl mt-4 hover:bg-coral-hover transition shadow-sm">
                                    {lang === 'en' ? 'Join Event' : '模拟报名线下局'}
                                </button>
                            </div>
                        </div>
                    </section>

                    {/* 7. Brand Story */}
                    <section id="cloudy-story" className="max-w-6xl mx-auto px-4 py-8 w-full">
                        <div className="bg-white rounded-4xl p-8 border border-soft-gray k-card-shadow space-y-6">
                            <div className="flex items-center space-x-4 border-b border-soft-gray pb-4">
                                <CloudyLogoIcon />
                                <div>
                                    <h3 className="text-lg font-extrabold text-charcoal">Cloudy's Travel Diary</h3>
                                    <p className="text-xs text-coral font-semibold">Cloud & Stories | Collecting forgotten city moments</p>
                                </div>
                            </div>

                            <div className="text-xs text-charcoal/70 leading-relaxed space-y-3 bg-gradient-to-r from-soft-purple/20 via-cream to-soft-pink/20 p-6 rounded-3xl border border-soft-purple/30">
                                <p>In a lively, charming city lives a little pigeon named Cloudy. Unlike other pigeons, Cloudy has soft, fluffy cloud-shaped wings that puff up whenever something exciting happens.</p>
                                <p>Wearing a favourite red beret and carrying a yellow satchel filled with maps and stamps, Cloudy prefers getting lost slowly over rushing.</p>
                                <p className="font-bold text-charcoal italic">“Travel isn’t about going far; it’s about truly meeting the city where you are.”</p>
                            </div>
                        </div>
                    </section>

                    <footer className="bg-charcoal text-cream/70 text-xs py-8 px-4 text-center border-t border-charcoal/20">
                        <p>© 2026 Meet Cloudy | Cloud & Stories Bristol</p>
                    </footer>

                    {/* Booking Modal */}
                    {selectedExp && (
                        <div className="fixed inset-0 bg-charcoal/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-4xl p-6 lg:p-8 max-w-md w-full space-y-4 shadow-2xl border border-soft-gray">
                                <div className="flex justify-between items-center">
                                    <h3 className="font-bold text-base text-charcoal">{lang === 'en' ? 'Book Local Experience' : '预约文化体验局'}</h3>
                                    <button onClick={() => { setSelectedExp(null); setBookingSuccess(false); }} className="text-charcoal/40 hover:text-charcoal">
                                        <i className="fa-solid fa-xmark text-lg"></i>
                                    </button>
                                </div>

                                {!bookingSuccess ? (
                                    <div className="space-y-4 text-xs">
                                        <div className="flex gap-3 bg-soft-pink/20 p-3.5 rounded-2xl border border-soft-pink">
                                            <img src={selectedExp.image} className="w-16 h-16 object-cover rounded-xl" />
                                            <div>
                                                <h4 className="font-bold text-charcoal">{lang === 'en' ? selectedExp.title : selectedExp.titleZh}</h4>
                                                <p className="text-coral font-extrabold mt-1">£{selectedExp.price} / person</p>
                                            </div>
                                        </div>
                                        <button 
                                            onClick={() => setBookingSuccess(true)}
                                            className="w-full bg-coral text-white font-bold py-3.5 rounded-2xl text-xs hover:bg-coral-hover transition shadow-md"
                                        >
                                            {lang === 'en' ? 'Confirm Booking' : '确认并模拟预订'}
                                        </button>
                                    </div>
                                ) : (
                                    <div className="text-center py-6 space-y-3">
                                        <div className="text-4xl">🎉</div>
                                        <h4 className="font-bold text-charcoal text-base">{lang === 'en' ? 'Booking Confirmed!' : '组局预约成功！'}</h4>
                                        <p className="text-xs text-charcoal/60">{lang === 'en' ? 'Cloudy sent your confirmation voucher. See you in Bristol!' : 'Cloudy 已将预约凭证发至您的账户。期待与您相遇！'}</p>
                                        <button 
                                            onClick={() => { setSelectedExp(null); setBookingSuccess(false); }}
                                            className="bg-charcoal text-white text-xs font-bold px-6 py-2.5 rounded-xl"
                                        >
                                            {lang === 'en' ? 'Close' : '关闭'}
                                        </button>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {/* Signup Modal */}
                    {showAuthModal && (
                        <div className="fixed inset-0 bg-charcoal/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-4xl p-6 lg:p-8 max-w-sm w-full space-y-5 shadow-2xl border border-soft-gray text-center">
                                <div className="w-12 h-12 bg-soft-pink/40 rounded-2xl flex items-center justify-center mx-auto border border-soft-pink">
                                    🎁
                                </div>
                                <h3 className="font-extrabold text-base text-charcoal">{lang === 'en' ? 'Join Cloud & Stories' : '加入云上有局'}</h3>
                                <p className="text-xs text-charcoal/60">{lang === 'en' ? 'Get a £10 welcome voucher + Cloudy digital badge.' : '注册即赠 £10 体验金 + Cloudy 线上纪念徽章'}</p>
                                <div className="space-y-3 text-xs">
                                    <input type="email" placeholder="Enter your Email / Phone" className="w-full bg-cream border border-soft-gray p-3 rounded-2xl focus:outline-none" />
                                    <button 
                                        onClick={() => {
                                            setIsLoggedIn(true);
                                            setShowAuthModal(false);
                                            alert('Registration successful! £10 voucher added to your account.');
                                        }}
                                        className="w-full bg-coral text-white font-bold py-3 rounded-2xl hover:bg-coral-hover transition k-soft-glow"
                                    >
                                        {lang === 'en' ? 'Sign Up & Claim Voucher' : '免费注册并领取福利'}
                                    </button>
                                </div>
                                <button onClick={() => setShowAuthModal(false)} className="text-[10px] text-charcoal/40 hover:underline">{lang === 'en' ? 'Continue browsing' : '暂不注册，继续浏览'}</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<CloudLoopApp />);
    </script>
</body>
</html>
