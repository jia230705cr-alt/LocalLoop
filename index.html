          extend: {
            colors: {

                '50%': { opacity: '0.7', transform: 'scale(1.15)' },

                    element.scrollIntoView({ behavior: 'smooth' });

                if (!hasLoadedMore) {
                    setExperiencesList([...experiencesList, ...extraExperiences]);
                    setHasLoadedMore(true);
                } else {
                    alert('All featured Bristol experiences are currently loaded!');
                }
            };

            const handleSwitchChatGroup = (group) => {
                setActiveChat(group);
                setChatMessages(group.messages);
            };

            const handleSendMessage = (e) => {
                e.preventDefault();
                if (!inputMsg.trim()) return;
                const newMsg = {
                    sender: isLoggedIn ? 'You (Explorer)' : 'Guest Traveler',
                    time: 'Just now',
                    text: inputMsg

                setInputMsg('');

                                        <div className="relative">
                                            <img src={exp.image} alt={exp.title} className="w-full h-48 object-cover" />
                                            <span className={`absolute top-3 left-3 font-bold text-[10px] px-3 py-1 rounded-full shadow-sm ${exp.tagColor}`}>
                                                {exp.categoryZh}
                                            </span>
                                        </div>
                                        <div className="p-5 space-y-2">
                                            <div className="text-[10px] text-charcoal/50 font-medium">📍 {exp.locationZh}</div>
                                            <h3 className="font-bold text-sm text-charcoal line-clamp-2 leading-snug">
                                                {lang === 'en' ? exp.title : exp.titleZh}
                                            </h3>
                                        </div>
                                    </div>
                                    <div className="p-5 pt-0 flex justify-between items-center border-t border-black/5 mt-2">
                                        <div>
                                            <span className="text-[10px] text-charcoal/50 font-bold">GBP</span>
                                            <span className="text-lg font-extrabold text-coral ml-1">£{exp.price}</span>
                                        </div>
                                        <button 
                                            onClick={() => setSelectedExp(exp)}
                                            className="bg-charcoal text-cream px-4 py-2 rounded-xl text-xs font-bold hover:bg-coral transition shadow-sm"
                                        >
                                            {lang === 'en' ? 'Book' : '预约组局'}
                                        </button>
                                    </div>
                                </div>
                            ))}
                        </div>

                        {!hasLoadedMore && (
                            <div className="text-center pt-2">
                                <button 
                                    onClick={handleLoadMore}
                                    className="bg-white border border-soft-pink text-charcoal font-bold px-8 py-3 rounded-full text-xs hover:bg-soft-pink/30 transition shadow-sm"
                                >
                                    ✨ {lang === 'en' ? 'Load More Bristol Cultural Walks' : '点击加载更多布里斯托在地文化局'}
                                </button>
                            </div>
                        )}
                    </section>

                    {/* ==================== 5. 全屏级高颜值手绘地图 (Full-Width Interactive Map) ==================== */}
                    <section id="city-explorer" className="max-w-6xl mx-auto px-4 py-8 w-full space-y-6">
                        <div className="border-b border-soft-gray pb-3 flex justify-between items-end">
                            <div>
                                <span className="text-[10px] font-bold text-mint-blue uppercase tracking-wider block">Full-Width Interactive Map</span>
                                <h2 className="text-2xl font-extrabold text-charcoal">{lang === 'en' ? '🗺️ Bristol Discovery Handcrafted Map' : '🗺️ 布里斯托手绘漫游大地图'}</h2>
                            </div>
                            <span className="text-xs text-charcoal/50 font-medium">Click markers to explore routes</span>
                        </div>

                        {/* 大尺寸地图容器 */}
                        <div className="bg-white rounded-4xl p-4 md:p-6 border border-soft-gray k-card-shadow space-y-6">
                            <div className="w-full h-96 lg:h-[420px] bg-gradient-to-br from-[#FFF9F2] via-[#FBF1E2] to-[#F3E6D2] rounded-3xl border-2 border-dashed border-[#E3D4BC] relative overflow-hidden shadow-inner flex items-center justify-center">
                                {/* 底纹及水域 */}
                                <div className="absolute inset-0 opacity-15 bg-[radial-gradient(#3A3330_1px,transparent_1px)] [background-size:22px_22px]"></div>
                                <svg className="absolute inset-0 w-full h-full pointer-events-none opacity-45">
                                    <path d="M 0 160 Q 250 280 500 140 T 1000 220" fill="none" stroke="#B4CEE6" strokeWidth="26" strokeLinecap="round" />
                                    <path d="M 120 280 Q 300 120 650 200" fill="none" stroke="#FF9B85" strokeWidth="3" strokeDasharray="8 8" />
                                </svg>

                                <span className="absolute top-4 left-4 z-10 bg-white/95 text-[11px] font-bold text-charcoal px-3.5 py-1.5 rounded-full border border-soft-pink shadow-md">
                                    💡 Interactive Pins: Click to reveal route guide
                                </span>
                                <div className="absolute top-6 right-8 text-xs font-extrabold text-charcoal/25 tracking-widest pointer-events-none">
                                    BRISTOL DISCOVERY MAP
                                </div>

                                {/* 地图地标点 1 */}
                                {mapPinsData.map((pin) => (
                                    <div 
                                        key={pin.id}
                                        style={{ top: pin.top, left: pin.left }}
                                        onClick={() => setActiveMapPin(pin)}
                                        className={`absolute cursor-pointer transform -translate-x-1/2 -translate-y-1/2 transition-all duration-300 ${activeMapPin.id === pin.id ? 'scale-110 z-30' : 'hover:scale-105 z-20'}`}
                                    >
                                        <div className="relative">
                                            <span className={`absolute -inset-1 rounded-full animate-pulseGlow ${activeMapPin.id === pin.id ? 'bg-coral' : 'bg-warm-yellow'}`}></span>
                                            <div className={`relative px-4 py-2 rounded-full shadow-lg border text-xs font-bold flex items-center space-x-1.5 ${
                                                activeMapPin.id === pin.id ? 'bg-coral text-white border-white' : 'bg-white text-charcoal border-soft-gray'
                                            }`}>
                                                <span>{pin.emoji}</span>
                                                <span className="whitespace-nowrap">{pin.name}</span>
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>

                            {/* 选中地标的下置展示横幅 */}
                            {activeMapPin && (
                                <div className="bg-gradient-to-r from-soft-pink/30 via-cream to-mint-blue/20 p-6 rounded-3xl border border-soft-pink/40 flex flex-col md:flex-row justify-between items-center gap-4">
                                    <div className="space-y-1">
                                        <div className="flex items-center space-x-2">
                                            <span className="text-xl">{activeMapPin.emoji}</span>
                                            <span className="text-xs font-bold bg-coral text-white px-2.5 py-0.5 rounded-full">{activeMapPin.type}</span>
                                            <h4 className="font-extrabold text-charcoal text-base">{activeMapPin.name}</h4>
                                        </div>
                                        <p className="text-xs text-charcoal/70">{activeMapPin.desc}</p>
                                    </div>
                                    <button onClick={() => alert(`Starting GPS route guide for ${activeMapPin.name}...`)} className="bg-charcoal text-white font-bold px-6 py-2.5 rounded-2xl text-xs hover:bg-coral transition shadow-md whitespace-nowrap">
                                        Start Route Navigation →
                                    </button>
                                </div>
                            )}
                        </div>
                    </section>

                    {/* ==================== 6. 重构版 Community 模块 (Part 1 + Part 2) ==================== */}
                    <section id="community-section" className="max-w-6xl mx-auto px-4 py-8 w-full space-y-8">
                        <div className="border-b border-soft-gray pb-3 flex justify-between items-end">
                            <div>
                                <span className="text-[10px] font-bold text-soft-purple uppercase tracking-wider block">Community Hub</span>
                                <h2 className="text-2xl font-extrabold text-charcoal">{lang === 'en' ? '💬 Bristol Community & Chat Circles' : '💬 社区流与城市群聊'}</h2>
                            </div>
                            <button onClick={() => setShowAuthModal(true)} className="text-xs font-bold text-coral hover:underline">
                                {lang === 'en' ? '+ Post Story' : '+ 发布我的私藏局'}
                            </button>
                        </div>

                        {/* PART 1: 带有 Tag 的动态 Post 流 */}
                        <div className="space-y-4">
                            <h3 className="font-extrabold text-sm text-charcoal flex items-center space-x-2">
                                <span>📌 Part 1: Explorer Feeds & Tagged Posts</span>
                                <span className="text-[10px] font-normal bg-soft-purple/30 text-charcoal px-2 py-0.5 rounded-full">User & Official Posts</span>
                            </h3>

                            <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                {communityPosts.map((post) => (
                                    <div key={post.id} className="bg-white p-6 rounded-3xl border border-soft-gray k-card-shadow flex flex-col justify-between space-y-4">
                                        <div className="space-y-3">
                                            <div className="flex justify-between items-center">
                                                <div className="flex items-center space-x-2">
                                                    <span className="w-8 h-8 rounded-full bg-soft-pink/50 flex items-center justify-center font-bold text-xs">{post.avatar}</span>
                                                    <div>
                                                        <div className="font-bold text-xs text-charcoal">{post.author}</div>
                                                        <div className="text-[10px] text-charcoal/40">{post.location} • {post.time}</div>
                                                    </div>
                                                </div>
                                                <span className={`text-[10px] px-2.5 py-0.5 rounded-full font-bold ${post.tagBg}`}>
                                                    {post.tag}
                                                </span>
                                            </div>
                                            <p className="text-xs text-charcoal/75 leading-relaxed">{post.text}</p>
                                        </div>
                                        <div className="pt-3 border-t border-cream flex justify-between items-center text-[10px] text-charcoal/50">
                                            <span>📍 Bristol Local</span>
                                            <button className="hover:text-coral font-bold" onClick={(e) => e.target.innerText = `❤️ ${post.likes + 1}`}>
                                                ❤️ {post.likes}
                                            </button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* PART 2: 城市主题讨论群组 / 群聊区 (Group Chats & Discussions) */}
                        <div className="space-y-4 pt-4">
                            <h3 className="font-extrabold text-sm text-charcoal flex items-center space-x-2">
                                <span>💬 Part 2: Bristol Chat Circles (Topic Groups)</span>
                                <span className="text-[10px] font-normal bg-mint-blue/30 text-charcoal px-2 py-0.5 rounded-full">Live Discussion</span>
                            </h3>

                            <div className="bg-white rounded-4xl border border-soft-gray k-card-shadow overflow-hidden flex flex-col md:flex-row h-[420px]">
                                {/* 群聊列表左侧栏 */}
                                <div className="w-full md:w-1/3 bg-cream/60 border-r border-soft-gray p-4 space-y-2">
                                    <div className="text-[10px] font-bold text-charcoal/40 uppercase tracking-wider px-2 mb-2">Select Chat Group</div>
                                    {chatGroups.map((group) => (
                                        <div 
                                            key={group.id}
                                            onClick={() => handleSwitchChatGroup(group)}
                                            className={`p-3.5 rounded-2xl cursor-pointer transition ${activeChat.id === group.id ? 'bg-white shadow-sm border border-soft-pink font-bold' : 'hover:bg-white/60 text-charcoal/70'}`}
                                        >
                                            <div className="text-xs font-bold text-charcoal">{group.name}</div>
                                            <div className="text-[10px] text-coral font-medium mt-1">👥 {group.members}</div>
                                        </div>
                                    ))}
                                </div>

                                {/* 聊天对话框右侧区 */}
                                <div className="w-full md:w-2/3 flex flex-col justify-between p-4 md:p-6 bg-white">
                                    <div className="border-b border-cream pb-3 flex justify-between items-center">
                                        <h4 className="font-extrabold text-sm text-charcoal">{activeChat.name}</h4>
                                        <span className="text-[10px] bg-mint-blue/20 text-charcoal px-2.5 py-1 rounded-full font-bold">🟢 Active Now</span>
                                    </div>

                                    {/* 消息滚动框 */}
                                    <div className="flex-1 overflow-y-auto space-y-3 py-4 pr-2">
                                        {chatMessages.map((msg, i) => (
                                            <div key={i} className={`flex flex-col ${msg.sender.includes('You') ? 'items-end' : 'items-start'}`}>
                                                <span className="text-[10px] text-charcoal/40 mb-1">{msg.sender} • {msg.time}</span>
                                                <div className={`p-3 rounded-2xl text-xs max-w-xs leading-relaxed ${
                                                    msg.sender.includes('You') ? 'bg-coral text-white' : (msg.sender.includes('Cloudy') ? 'bg-warm-yellow/40 border border-warm-yellow text-charcoal font-medium' : 'bg-cream text-charcoal')
                                                }`}>
                                                    {msg.text}
                                                </div>
                                            </div>
                                        ))}
                                    </div>

                                    {/* 输入框 */}
                                    <form onSubmit={handleSendMessage} className="flex gap-2 pt-3 border-t border-cream">
                                        <input 
                                            type="text" 
                                            value={inputMsg}
                                            onChange={(e) => setInputMsg(e.target.value)}
                                            placeholder={`Share your thoughts in ${activeChat.name}...`}
                                            className="flex-1 bg-cream border border-soft-gray px-4 py-2.5 rounded-2xl text-xs focus:outline-none"
                                        />
                                        <button type="submit" className="bg-coral text-white text-xs font-bold px-5 py-2.5 rounded-2xl hover:bg-coral-hover transition">
                                            Send
                                        </button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </section>

                    {/* 7. Brand Story */}
                    <section id="cloudy-story" className="max-w-6xl mx-auto px-4 py-8 w-full">
                        <div className="bg-white rounded-4xl p-8 border border-soft-gray k-card-shadow space-y-6">
                            <div className="flex items-center space-x-4 border-b border-soft-gray pb-4">
                                <CloudyLogoIcon />
                                <div>
                                    <h3 className="text-lg font-extrabold text-charcoal">Cloudy's Travel Diary</h3>
                                    <p className="text-xs text-coral font-semibold">Cloud & Stories | Collecting forgotten city moments</p>
                                </div>
                            </div>

                            <div className="text-xs text-charcoal/70 leading-relaxed space-y-3 bg-gradient-to-r from-soft-purple/20 via-cream to-soft-pink/20 p-6 rounded-3xl border border-soft-purple/30">
                                <p>In a lively, charming city lives a little pigeon named Cloudy. Unlike other pigeons, Cloudy has soft, fluffy cloud-shaped wings that puff up whenever something exciting happens.</p>
                                <p>Wearing a favourite red beret and carrying a yellow satchel filled with maps and stamps, Cloudy prefers getting lost slowly over rushing.</p>
                                <p className="font-bold text-charcoal italic">“Travel isn’t about going far; it’s about truly meeting the city where you are.”</p>
                            </div>
                        </div>
                    </section>

                    <footer className="bg-charcoal text-cream/70 text-xs py-8 px-4 text-center border-t border-charcoal/20">
                        <p>© 2026 Meet Cloudy | Cloud & Stories Bristol</p>
                    </footer>

                    {/* Booking Modal */}
                    {selectedExp && (
                        <div className="fixed inset-0 bg-charcoal/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-4xl p-6 lg:p-8 max-w-md w-full space-y-4 shadow-2xl border border-soft-gray">
                                <div className="flex justify-between items-center">
                                    <h3 className="font-bold text-base text-charcoal">{lang === 'en' ? 'Book Local Experience' : '预约文化体验局'}</h3>
                                    <button onClick={() => { setSelectedExp(null); setBookingSuccess(false); }} className="text-charcoal/40 hover:text-charcoal">
                                        <i className="fa-solid fa-xmark text-lg"></i>
                                    </button>
                                </div>

                                {!bookingSuccess ? (
                                    <div className="space-y-4 text-xs">
                                        <div className="flex gap-3 bg-soft-pink/20 p-3.5 rounded-2xl border border-soft-pink">
                                            <img src={selectedExp.image} className="w-16 h-16 object-cover rounded-xl" />
                                            <div>
                                                <h4 className="font-bold text-charcoal">{lang === 'en' ? selectedExp.title : selectedExp.titleZh}</h4>
                                                <p className="text-coral font-extrabold mt-1">£{selectedExp.price} / person</p>
                                            </div>
                                        </div>
                                        <button 
                                            onClick={() => setBookingSuccess(true)}
                                            className="w-full bg-coral text-white font-bold py-3.5 rounded-2xl text-xs hover:bg-coral-hover transition shadow-md"
                                        >
                                            {lang === 'en' ? 'Confirm Booking' : '确认并模拟预订'}
                                        </button>
                                    </div>
                                ) : (
                                    <div className="text-center py-6 space-y-3">
                                        <div className="text-4xl">🎉</div>
                                        <h4 className="font-bold text-charcoal text-base">{lang === 'en' ? 'Booking Confirmed!' : '组局预约成功！'}</h4>
                                        <p className="text-xs text-charcoal/60">{lang === 'en' ? 'Cloudy sent your confirmation voucher. See you in Bristol!' : 'Cloudy 已将预约凭证发至您的账户。期待与您相遇！'}</p>
                                        <button 
                                            onClick={() => { setSelectedExp(null); setBookingSuccess(false); }}
                                            className="bg-charcoal text-white text-xs font-bold px-6 py-2.5 rounded-xl"
                                        >
                                            {lang === 'en' ? 'Close' : '关闭'}
                                        </button>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {/* Signup Modal */}
                    {showAuthModal && (
                        <div className="fixed inset-0 bg-charcoal/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-4xl p-6 lg:p-8 max-w-sm w-full space-y-5 shadow-2xl border border-soft-gray text-center">
                                <div className="w-12 h-12 bg-soft-pink/40 rounded-2xl flex items-center justify-center mx-auto border border-soft-pink">
                                    🎁
                                </div>
                                <h3 className="font-extrabold text-base text-charcoal">{lang === 'en' ? 'Join Cloud & Stories' : '加入云上有局'}</h3>
                                <p className="text-xs text-charcoal/60">{lang === 'en' ? 'Get a £10 welcome voucher + Cloudy digital badge.' : '注册即赠 £10 体验金 + Cloudy 线上纪念徽章'}</p>
                                <div className="space-y-3 text-xs">
                                    <input type="email" placeholder="Enter your Email / Phone" className="w-full bg-cream border border-soft-gray p-3 rounded-2xl focus:outline-none" />
                                    <button 
                                        onClick={() => {
                                            setIsLoggedIn(true);
                                            setShowAuthModal(false);
                                            alert('Registration successful! £10 voucher added to your account.');
                                        }}
                                        className="w-full bg-coral text-white font-bold py-3 rounded-2xl hover:bg-coral-hover transition k-soft-glow"
                                    >
                                        {lang === 'en' ? 'Sign Up & Claim Voucher' : '免费注册并领取福利'}
                                    </button>
                                </div>
                                <button onClick={() => setShowAuthModal(false)} className="text-[10px] text-charcoal/40 hover:underline">{lang === 'en' ? 'Continue browsing' : '暂不注册，继续浏览'}</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<CloudLoopApp />);
    </script>
</body>
</html>
