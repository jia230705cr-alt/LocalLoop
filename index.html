<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>云上有局 Cloud & Gathering - 上海 Shanghai</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              cream: '#FAF7F2',
              'cream-card': '#FFFFFF',
              coral: '#E86A58',
              'coral-hover': '#D65846',
              'mist-blue': '#A3C1E0',
              'warm-yellow': '#F7D070',
              'soft-gray': '#F2EDE4',
              'charcoal': '#2C2825',
            },
            borderRadius: {
              '4xl': '2rem',
            }
          }
        }
      }
    </script>
    <!-- React, ReactDOM & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #FAF7F2; color: #2C2825; }
        .k-card-shadow { box-shadow: 0 12px 35px -8px rgba(44, 40, 37, 0.04); }
        .k-soft-shadow { box-shadow: 0 8px 20px rgba(232, 106, 88, 0.12); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // 上海精选体验样本数据
        const initialExperiences = [
            {
                id: 'exp1',
                title: 'Traditional Calligraphy & Tea Workshop in Lane House',
                titleZh: '老洋房天井：书法写意与老上海大碗茶体验局',
                category: 'Traditional Culture',
                categoryZh: '传统文化局',
                price: 128,
                rating: 4.9,
                location: 'Former French Concession',
                locationZh: '徐汇区 • 法租界老洋房',
                duration: '2h',
                image: 'https://images.unsplash.com/photo-1544717305-2782549b5136?auto=format&fit=crop&w=800&q=80'
            },
            {
                id: 'exp2',
                title: 'Xiao Long Bao Masterclass with Local Chef',
                titleZh: '老字号师傅带教：18褶上海正宗小笼包手作局',
                category: 'Food Experience',
                categoryZh: '地道美食局',
                price: 188,
                rating: 4.95,
                location: 'Yuyuan Garden Area',
                locationZh: '黄浦区 • 豫园老街',
                duration: '2.5h',
                image: 'https://images.unsplash.com/photo-1563245372-f21724e3856d?auto=format&fit=crop&w=800&q=80'
            },
            {
                id: 'exp3',
                title: 'Handmade Porcelain Pottery Painting',
                titleZh: '文创园区手艺人：青花瓷拉胚与釉下彩体验局',
                category: 'Arts & Crafts',
                categoryZh: '手艺工坊局',
                price: 158,
                rating: 4.88,
                location: 'Jing’an Creative Park',
                locationZh: '静安区 • 文创园',
                duration: '2h',
                image: 'https://images.unsplash.com/photo-1565193566173-7a0ee3dbe261?auto=format&fit=crop&w=800&q=80'
            },
            {
                id: 'exp4',
                title: 'Bund & Cyberpunk Night Photography Walk',
                titleZh: '光影夜上海：外滩与陆家嘴夜景摄影导览局',
                category: 'City Walk',
                categoryZh: '慢游探城局',
                price: 150,
                rating: 4.92,
                location: 'The Bund',
                locationZh: '黄浦区 • 外滩建筑群',
                duration: '3h',
                image: 'https://images.unsplash.com/photo-1508804185872-d7badad00f7d?auto=format&fit=crop&w=800&q=80'
            }
        ];

        function CloudLoopApp() {
            // 全局状态
            const [lang, setLang] = useState('zh'); // 'zh' 或 'en'
            const [city, setCity] = useState('Shanghai');
            const [searchKeyword, setSearchKeyword] = useState('');
            const [activeCategory, setActiveCategory] = useState('All');
            const [selectedExp, setSelectedExp] = useState(null); // 预订弹窗控制
            const [bookingSuccess, setBookingSuccess] = useState(false);
            const [stampsUnlocked, setStampsUnlocked] = useState(2);
            const [isLoggedIn, setIsLoggedIn] = useState(false);

            // 过滤算法
            const filteredExps = initialExperiences.filter(item => {
                const titleMatch = lang === 'zh' 
                    ? item.titleZh.toLowerCase().includes(searchKeyword.toLowerCase())
                    : item.title.toLowerCase().includes(searchKeyword.toLowerCase());
                const categoryMatch = activeCategory === 'All' || item.category === activeCategory;
                return titleMatch && categoryMatch;
            });

            const scrollToSection = (id) => {
                const element = document.getElementById(id);
                if (element) {
                    element.scrollIntoView({ behavior: 'smooth' });
                }
            };

            return (
                <div className="min-h-screen flex flex-col justify-between selection:bg-coral/20">
                    {/* ==================== 顶部导航栏 (Navbar - 韩系极简风) ==================== */}
                    <header className="sticky top-0 z-50 bg-cream/80 backdrop-blur-md border-b border-soft-gray px-4 lg:px-8 py-3.5 flex items-center justify-between">
                        {/* 左侧：Logo & 地区选择 */}
                        <div className="flex items-center space-x-4">
                            <div className="flex items-center space-x-2.5 cursor-pointer" onClick={() => window.scrollTo({top: 0, behavior: 'smooth'})}>
                                <div className="w-10 h-10 rounded-2xl bg-white border border-soft-gray flex items-center justify-center text-xl shadow-sm">
                                    ☁️
                                </div>
                                <div>
                                    <span className="text-xl font-extrabold tracking-tight text-charcoal leading-none block">
                                        云上有局 <span className="text-coral text-xs font-semibold uppercase tracking-wider ml-1">Cloud & Gathering</span>
                                    </span>
                                </div>
                            </div>

                            {/* 城市选择器下拉 */}
                            <div className="relative border-l border-soft-gray pl-4 hidden sm:block">
                                <button className="bg-white px-3.5 py-1.5 rounded-full border border-soft-gray text-xs font-bold text-charcoal flex items-center space-x-1.5 hover:border-coral transition shadow-sm">
                                    <i className="fa-solid fa-location-dot text-coral text-xs"></i>
                                    <span>{lang === 'zh' ? '上海 Shanghai' : 'Shanghai'}</span>
                                    <i className="fa-solid fa-chevron-down text-[10px] text-charcoal/40 ml-1"></i>
                                </button>
                            </div>
                        </div>

                        {/* 中间：四大核心功能菜单 */}
                        <nav className="hidden md:flex items-center space-x-7 text-xs font-bold text-charcoal/75 tracking-wide">
                            <button onClick={() => scrollToSection('experience-hub')} className="hover:text-coral transition flex items-center space-x-1.5">
                                <span>⛩️</span>
                                <span>{lang === 'zh' ? '体验中心' : 'Experience Hub'}</span>
                            </button>
                            <button onClick={() => scrollToSection('city-explorer')} className="hover:text-coral transition flex items-center space-x-1.5">
                                <span>🗺️</span>
                                <span>{lang === 'zh' ? '探城地图' : 'City Explorer'}</span>
                            </button>
                            <button onClick={() => scrollToSection('achievement-center')} className="hover:text-coral transition flex items-center space-x-1.5">
                                <span>📖</span>
                                <span>{lang === 'zh' ? '成就中心' : 'Achievement Center'}</span>
                            </button>
                            <button onClick={() => scrollToSection('community-events')} className="hover:text-coral transition flex items-center space-x-1.5">
                                <span>💬</span>
                                <span>{lang === 'zh' ? '社群局' : 'Community & Events'}</span>
                            </button>
                        </nav>

                        {/* 右侧：语言切换 & 登录账户 */}
                        <div className="flex items-center space-x-3">
                            <button 
                                onClick={() => setLang(lang === 'zh' ? 'en' : 'zh')}
                                className="px-3.5 py-1.5 rounded-full border border-soft-gray bg-white text-xs font-bold text-charcoal hover:border-coral transition shadow-sm"
                            >
                                {lang === 'zh' ? 'EN / 中文' : '中文 / EN'}
                            </button>

                            <button 
                                onClick={() => setIsLoggedIn(!isLoggedIn)}
                                className={`text-xs font-bold px-4 py-2 rounded-full shadow-sm transition flex items-center space-x-1.5 ${
                                    isLoggedIn ? 'bg-mist-blue/20 text-charcoal' : 'bg-coral text-white hover:bg-coral-hover k-soft-shadow'
                                }`}
                            >
                                <i className="fa-regular fa-user"></i>
                                <span>{isLoggedIn ? (lang === 'zh' ? '我的账户' : 'Profile') : (lang === 'zh' ? '登录 / 注册' : 'Sign In')}</span>
                            </button>
                        </div>
                    </header>

                    {/* ==================== 1. Hero 搜索与 IP 展示区 (韩系杂志排版) ==================== */}
                    <section className="max-w-6xl mx-auto px-4 pt-8 pb-6 w-full">
                        <div className="bg-white rounded-4xl p-8 lg:p-12 border border-soft-gray k-card-shadow flex flex-col md:flex-row items-center justify-between gap-8 relative overflow-hidden">
                            <div className="md:w-3/5 space-y-6 z-10">
                                <div className="inline-flex items-center space-x-2 bg-cream text-coral text-xs font-bold px-3.5 py-1.5 rounded-full border border-soft-gray">
                                    <span>🧢 Cloudy（云朵鸽）带你探索上海</span>
                                </div>
                                <h1 className="text-3xl lg:text-5xl font-extrabold text-charcoal leading-tight tracking-tight">
                                    {lang === 'zh' ? (
                                        <>跟着云朵走，<br/><span className="text-coral">发现上海的小惊喜。</span></>
                                    ) : (
                                        <>Follow the Clouds,<br/><span className="text-coral">Find the Local.</span></>
                                    )}
                                </h1>
                                <p className="text-charcoal/65 text-xs lg:text-sm leading-relaxed max-w-md">
                                    {lang === 'zh' 
                                        ? '针对上海特调的在地文化体验平台。真正走入老洋房、体验手作小笼包、探索私房 Citywalk。' 
                                        : 'Discover hidden gems, authentic cultural experiences, and local food in Shanghai.'}
                                </p>

                                {/* 全局快速搜索框 */}
                                <div className="pt-2">
                                    <div className="flex bg-cream p-1.5 rounded-2xl border border-soft-gray max-w-lg">
                                        <div className="flex items-center pl-3.5 text-charcoal/40">
                                            <i className="fa-solid fa-magnifying-glass text-xs"></i>
                                        </div>
                                        <input 
                                            type="text" 
                                            value={searchKeyword}
                                            onChange={(e) => setSearchKeyword(e.target.value)}
                                            placeholder={lang === 'zh' ? "搜索：小笼包、老洋房书法、摄影..." : "Search: Xiao Long Bao, Calligraphy..."}
                                            className="w-full bg-transparent px-3 py-2 text-xs font-medium focus:outline-none text-charcoal placeholder-charcoal/40"
                                        />
                                        <button 
                                            onClick={() => scrollToSection('experience-hub')}
                                            className="bg-coral text-white font-bold px-5 py-2.5 rounded-xl text-xs hover:bg-coral-hover transition whitespace-nowrap shadow-sm"
                                        >
                                            {lang === 'zh' ? '搜索局' : 'Search'}
                                        </button>
                                    </div>
                                </div>
                            </div>

                            {/* Cloudy IP 招牌展示区 */}
                            <div className="md:w-2/5 flex flex-col items-center justify-center">
                                <div className="w-64 h-64 bg-cream rounded-full flex flex-col items-center justify-center border-2 border-dashed border-soft-gray p-6 text-center shadow-inner relative">
                                    <div className="text-7xl animate-bounce mb-2">🕊️</div>
                                    <span className="text-[11px] font-bold bg-white text-coral border border-soft-gray px-3 py-1 rounded-full shadow-sm">
                                        ☁️ 云朵翅膀 + 🧢 小红帽
                                    </span>
                                    <p className="text-[11px] text-charcoal/60 mt-2.5 font-medium italic">
                                        {lang === 'zh' ? '“今天适合去法租界喝大碗茶看梧桐树！”' : '“Perfect day for local tea & street walk!”'}
                                    </p>
                                </div>
                            </div>
                        </div>
                    </section>

                    {/* ==================== 2. 功能一：Experience Hub (优先预订) ==================== */}
                    <section id="experience-hub" className="max-w-6xl mx-auto px-4 py-10 w-full space-y-6">
                        <div className="flex flex-col md:flex-row md:items-end justify-between gap-4 border-b border-soft-gray pb-4">
                            <div>
                                <div className="inline-block text-[11px] font-bold text-coral uppercase tracking-wider mb-1">
                                    Experience Hub
                                </div>
                                <h2 className="text-2xl lg:text-3xl font-extrabold text-charcoal">
                                    {lang === 'zh' ? '⛩️ 寻找你的下一个上海在地局' : 'Explore Local Cultural Experiences'}
                                </h2>
                            </div>

                            {/* 分类过滤 */}
                            <div className="flex space-x-2 overflow-x-auto pb-1">
                                {['All', 'Traditional Culture', 'Food Experience', 'Arts & Crafts', 'City Walk'].map(cat => (
                                    <button 
                                        key={cat}
                                        onClick={() => setActiveCategory(cat)}
                                        className={`px-4 py-2 rounded-full text-xs font-bold transition whitespace-nowrap ${
                                            activeCategory === cat 
                                                ? 'bg-coral text-white shadow-sm' 
                                                : 'bg-white text-charcoal/70 border border-soft-gray hover:bg-cream'
                                        }`}
                                    >
                                        {cat === 'All' ? (lang === 'zh' ? '全部体验局' : 'All') : cat}
                                    </button>
                                ))}
                            </div>
                        </div>

                        {/* 体验卡片网格 */}
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                            {filteredExps.length > 0 ? (
                                filteredExps.map((exp) => (
                                    <div key={exp.id} className="bg-white rounded-3xl overflow-hidden border border-soft-gray k-card-shadow hover:-translate-y-1.5 transition duration-300 flex flex-col justify-between">
                                        <div>
                                            <div className="relative">
                                                <img src={exp.image} alt={exp.title} className="w-full h-44 object-cover" />
                                                <span className="absolute top-3 left-3 bg-white/90 backdrop-blur-sm text-charcoal font-bold text-[10px] px-2.5 py-1 rounded-full border border-soft-gray shadow-sm">
                                                    {lang === 'zh' ? exp.categoryZh : exp.category}
                                                </span>
                                            </div>
                                            <div className="p-5 space-y-2">
                                                <div className="flex justify-between items-center text-[11px] text-charcoal/50 font-medium">
                                                    <span>📍 {lang === 'zh' ? exp.locationZh : exp.location}</span>
                                                    <span>⏱️ {exp.duration}</span>
                                                </div>
                                                <h3 className="font-bold text-sm text-charcoal line-clamp-2 leading-snug">
                                                    {lang === 'zh' ? exp.titleZh : exp.title}
                                                </h3>
                                            </div>
                                        </div>
                                        <div className="p-5 pt-0 border-t border-cream flex justify-between items-center mt-2">
                                            <div>
                                                <span className="text-[10px] text-charcoal/40 font-bold">RMB</span>
                                                <span className="text-lg font-extrabold text-coral ml-1">¥{exp.price}</span>
                                            </div>
                                            <button 
                                                onClick={() => setSelectedExp(exp)}
                                                className="bg-charcoal text-cream px-4 py-2 rounded-xl text-xs font-bold hover:bg-coral transition shadow-sm"
                                            >
                                                {lang === 'zh' ? '组局预约' : 'Book Now'}
                                            </button>
                                        </div>
                                    </div>
                                ))
                            ) : (
                                <div className="col-span-full py-12 text-center text-charcoal/50 text-xs">
                                    {lang === 'zh' ? '没有找到符合条件的体验局，尝试换个词搜索吧～' : 'No experiences found.'}
                                </div>
                            )}
                        </div>
                    </section>

                    {/* ==================== 3. 功能二：City Explorer (探城地图) ==================== */}
                    <section id="city-explorer" className="max-w-6xl mx-auto px-4 py-10 w-full space-y-6">
                        <div className="border-b border-soft-gray pb-4">
                            <div className="inline-block text-[11px] font-bold text-mist-blue uppercase tracking-wider mb-1">
                                City Explorer
                            </div>
                            <h2 className="text-2xl lg:text-3xl font-extrabold text-charcoal">
                                {lang === 'zh' ? '🗺️ 武康路至外滩：Cloudy 的手绘路线图' : 'Explore Shanghai Neighbourhoods'}
                            </h2>
                        </div>

                        <div className="bg-white rounded-4xl p-6 lg:p-8 border border-soft-gray k-card-shadow flex flex-col lg:flex-row gap-6 items-center">
                            {/* 地图模拟面板 */}
                            <div className="w-full lg:w-2/3 h-80 bg-cream rounded-3xl border-2 border-dashed border-soft-gray relative overflow-hidden flex items-center justify-center">
                                <div className="absolute inset-0 opacity-10 bg-[radial-gradient(#2C2825_1px,transparent_1px)] [background-size:18px_18px]"></div>
                                <span className="absolute top-4 left-4 bg-white/90 text-[11px] font-bold text-charcoal px-3 py-1 rounded-full border border-soft-gray shadow-sm">
                                    📍 {lang === 'zh' ? '上海市核心打卡区域交互地图' : 'Shanghai Core Interactive Map'}
                                </span>

                                {/* 交互点位 1 */}
                                <div className="absolute top-1/3 left-1/3 group cursor-pointer" onClick={() => alert('已选定：武康路梧桐树咖啡走廊')}>
                                    <div className="w-9 h-9 bg-coral text-white rounded-full flex items-center justify-center shadow-md text-sm group-hover:scale-125 transition">📍</div>
                                    <div className="bg-charcoal text-white text-[10px] px-2.5 py-0.5 rounded-full mt-1 shadow whitespace-nowrap">武康路</div>
                                </div>
                                {/* 交互点位 2 */}
                                <div className="absolute top-1/2 left-2/3 group cursor-pointer" onClick={() => alert('已选定：豫园老街与九曲桥体验点')}>
                                    <div className="w-9 h-9 bg-warm-yellow text-charcoal rounded-full flex items-center justify-center shadow-md text-sm group-hover:scale-125 transition">📍</div>
                                    <div className="bg-charcoal text-white text-[10px] px-2.5 py-0.5 rounded-full mt-1 shadow whitespace-nowrap">豫园老街</div>
                                </div>
                            </div>

                            {/* 路线说明 */}
                            <div className="w-full lg:w-1/3 space-y-4">
                                <div className="bg-cream p-5 rounded-3xl border border-soft-gray">
                                    <span className="text-[10px] font-bold bg-coral/15 text-coral px-2.5 py-1 rounded-full">Citywalk Route</span>
                                    <h4 className="font-bold text-charcoal text-sm mt-2">{lang === 'zh' ? '【武康路-安福路】梧桐树与咖啡漫步' : 'Wukang Rd Coffee & Heritage Trail'}</h4>
                                    <p className="text-xs text-charcoal/65 mt-1.5 leading-relaxed">
                                        {lang === 'zh' ? '全程约 2.8 公里，打卡 4 家独立咖啡馆与老洋房建筑。' : '2.8 km walk connecting heritage lanes and indie cafes.'}
                                    </p>
                                </div>
                                <button className="w-full bg-mist-blue/20 text-charcoal font-bold py-3.5 rounded-2xl text-xs hover:bg-mist-blue/40 transition">
                                    {lang === 'zh' ? '查看更多上海 Citywalk 路线 →' : 'View All Shanghai Citywalk Routes →'}
                                </button>
                            </div>
                        </div>
                    </section>

                    {/* ==================== 4. 功能三：Achievement Center (成就中心) ==================== */}
                    <section id="achievement-center" className="max-w-6xl mx-auto px-4 py-10 w-full space-y-6">
                        <div className="border-b border-soft-gray pb-4">
                            <div className="inline-block text-[11px] font-bold text-warm-yellow uppercase tracking-wider mb-1">
                                Achievement Center
                            </div>
                            <h2 className="text-2xl lg:text-3xl font-extrabold text-charcoal">
                                {lang === 'zh' ? '📖 上海数字护照与打卡成就' : 'Local Passport & Achievements'}
                            </h2>
                        </div>

                        <div className="bg-charcoal text-cream p-7 lg:p-10 rounded-4xl card-shadow border-4 border-warm-yellow/20 flex flex-col md:flex-row justify-between items-center gap-8">
                            <div className="space-y-4 md:w-1/2">
                                <div className="flex items-center space-x-2">
                                    <span className="text-2xl">☁️</span>
                                    <span className="font-extrabold text-white text-base tracking-widest">SHANGHAI PASSPORT</span>
                                </div>
                                <p className="text-xs text-cream/70 leading-relaxed">
                                    {lang === 'zh' 
                                        ? '前往线下合作老茶馆或手工艺工坊，手机扫码即可解锁上海数字印章，换取限定合作折扣！' 
                                        : 'Scan QR codes at offline partner stores to collect stamps and unlock discounts.'}
                                </p>
                                <div className="bg-white/10 p-3.5 rounded-2xl border border-white/10 space-y-2">
                                    <div className="flex justify-between text-xs font-bold">
                                        <span>{lang === 'zh' ? '上海印章收集进度' : 'Stamp Progress'}</span>
                                        <span className="text-warm-yellow">{stampsUnlocked} / 4 解锁</span>
                                    </div>
                                    <div className="w-full bg-white/20 h-2 rounded-full overflow-hidden">
                                        <div className="bg-warm-yellow h-full transition-all" style={{width: `${(stampsUnlocked/4)*100}%`}}></div>
                                    </div>
                                </div>
                            </div>

                            {/* 印章展示 */}
                            <div className="grid grid-cols-2 gap-3.5 w-full md:w-1/2">
                                <div className="bg-white/10 p-4 rounded-2xl text-center border border-warm-yellow/30">
                                    <div className="text-2xl mb-1">🍵</div>
                                    <div className="text-xs font-bold text-white">{lang === 'zh' ? '百年茶楼章' : 'Teahouse'}</div>
                                    <span className="text-[10px] text-warm-yellow font-medium">✔ {lang === 'zh' ? '已点亮' : 'Unlocked'}</span>
                                </div>
                                <div className="bg-white/10 p-4 rounded-2xl text-center border border-warm-yellow/30">
                                    <div className="text-2xl mb-1">🥟</div>
                                    <div className="text-xs font-bold text-white">{lang === 'zh' ? '小笼包达人章' : 'Dumpling Master'}</div>
                                    <span className="text-[10px] text-warm-yellow font-medium">✔ {lang === 'zh' ? '已点亮' : 'Unlocked'}</span>
                                </div>
                                <div className="bg-white/5 p-4 rounded-2xl text-center border border-white/10 opacity-60 cursor-pointer" onClick={() => setStampsUnlocked(prev => Math.min(4, prev+1))}>
                                    <div className="text-2xl mb-1">📸</div>
                                    <div className="text-xs font-bold text-white">{lang === 'zh' ? '外滩夜游章' : 'Night Walk'}</div>
                                    <span className="text-[10px] text-cream/50">{lang === 'zh' ? '点击模拟解锁' : 'Click to Unlock'}</span>
                                </div>
                                <div className="bg-white/5 p-4 rounded-2xl text-center border border-white/10 opacity-60">
                                    <div className="text-2xl mb-1">🎨</div>
                                    <div className="text-xs font-bold text-white">{lang === 'zh' ? '青花瓷体验章' : 'Pottery Stamp'}</div>
                                    <span className="text-[10px] text-cream/50">{lang === 'zh' ? '待解锁' : 'Locked'}</span>
                                </div>
                            </div>
                        </div>
                    </section>

                    {/* ==================== 5. 功能四：Community & Events (社群与线下局) ==================== */}
                    <section id="community-events" className="max-w-6xl mx-auto px-4 py-10 w-full space-y-6">
                        <div className="border-b border-soft-gray pb-4 flex justify-between items-end">
                            <div>
                                <div className="inline-block text-[11px] font-bold text-coral uppercase tracking-wider mb-1">
                                    Community & Events
                                </div>
                                <h2 className="text-2xl lg:text-3xl font-extrabold text-charcoal">
                                    {lang === 'zh' ? '💬 云上局 Community & 线下体验聚会' : 'Community & Offline Meetups'}
                                </h2>
                            </div>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                            <div className="bg-white p-6 rounded-3xl border border-soft-gray k-card-shadow space-y-3">
                                <div className="flex items-center space-x-2.5 text-xs">
                                    <span className="w-8 h-8 rounded-full bg-mist-blue/30 flex items-center justify-center font-bold text-charcoal">A</span>
                                    <div>
                                        <div className="font-bold text-charcoal">Alex ( 英国 🇬🇧 )</div>
                                        <div className="text-[10px] text-charcoal/40">上海法租界 • 2小时前</div>
                                    </div>
                                </div>
                                <p className="text-xs text-charcoal/70 leading-relaxed">
                                    {lang === 'zh' ? '跟着 Cloudy 找到了这家老洋房天井茶馆，拿到了我的第一个大碗茶印章，体验太棒了！' : 'Found this incredible lane house teahouse thanks to Cloudy! Unlocked my first stamp.'}
                                </p>
                            </div>

                            <div className="bg-white p-6 rounded-3xl border border-soft-gray k-card-shadow space-y-3">
                                <div className="flex items-center space-x-2.5 text-xs">
                                    <span className="w-8 h-8 rounded-full bg-coral/20 text-coral flex items-center justify-center font-bold">L</span>
                                    <div>
                                        <div className="font-bold text-charcoal">Lily ( 本地领队 🇨🇳 )</div>
                                        <div className="text-[10px] text-charcoal/40">上海豫园 • 昨天</div>
                                    </div>
                                </div>
                                <p className="text-xs text-charcoal/70 leading-relaxed">
                                    {lang === 'zh' ? '本周末【云上局线下相聚局：手作小笼包与古风摄影】开始报名啦！欢迎中外朋友一起来玩。' : 'Weekend meetup: Xiao Long Bao making & photo walk open for signups!'}
                                </p>
                            </div>

                            <div className="bg-white p-6 rounded-3xl border border-soft-gray k-card-shadow flex flex-col justify-between">
                                <div>
                                    <span className="text-[10px] font-bold bg-warm-yellow/30 text-charcoal px-3 py-1 rounded-full">
                                        🎉 官方线下局预告
                                    </span>
                                    <h4 className="font-bold text-sm text-charcoal mt-3">{lang === 'zh' ? '周末 CloudLoop 中外文化相聚局' : 'Weekend Cross-Cultural Meetup'}</h4>
                                    <p className="text-xs text-charcoal/60 mt-1">地点：静安区文创园体验中心</p>
                                </div>
                                <button onClick={() => alert('线下局报名成功！组委会将通过 Email 联系您。')} className="w-full bg-coral text-white text-xs font-bold py-2.5 rounded-xl mt-4 hover:bg-coral-hover transition shadow-sm">
                                    {lang === 'zh' ? '模拟报名线下局' : 'Join Event'}
                                </button>
                            </div>
                        </div>
                    </section>

                    {/* ==================== 6. IP 形象与品牌故事 ==================== */}
                    <section className="bg-cream border-t border-soft-gray py-14">
                        <div className="max-w-4xl mx-auto px-4 text-center space-y-4">
                            <div className="w-16 h-16 bg-white rounded-2xl flex items-center justify-center mx-auto text-3xl shadow-sm border border-soft-gray">
                                🕊️
                            </div>
                            <h3 className="text-xl font-extrabold text-charcoal">
                                {lang === 'zh' ? '关于 Cloudy 云朵鸽｜一个收集城市故事的小家伙' : 'Meet Cloudy the Pigeon'}
                            </h3>
                            <p className="text-xs text-charcoal/70 leading-relaxed max-w-2xl mx-auto bg-white/80 p-6 rounded-3xl border border-soft-gray">
                                {lang === 'zh' 
                                    ? '它戴着心爱的小红帽，有着两团软绵绵的云朵翅膀。在上海的梧桐树与巷弄里，它喜欢慢慢走。旅行不一定要走得很远，重要的是，你有没有真正遇见这座城市。' 
                                    : 'A little pigeon with cloud wings and a red beret, traveling through cities to collect hidden gems and local stories.'}
                            </p>
                        </div>
                    </section>

                    {/* 页脚 */}
                    <footer className="bg-charcoal text-cream/70 text-xs py-8 px-4 text-center border-t border-charcoal/20">
                        <p>© 2026 云上有局 Cloud & Gathering • 上海试点城市双边文化体验平台</p>
                    </footer>

                    {/* ==================== 动态预订模态框 (Booking Modal - 韩系风格) ==================== */}
                    {selectedExp && (
                        <div className="fixed inset-0 bg-charcoal/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-4xl p-6 lg:p-8 max-w-md w-full space-y-5 shadow-2xl border border-soft-gray">
                                <div className="flex justify-between items-center">
                                    <h3 className="font-bold text-base text-charcoal">{lang === 'zh' ? '预约文化体验局' : 'Book Experience'}</h3>
                                    <button onClick={() => { setSelectedExp(null); setBookingSuccess(false); }} className="text-charcoal/40 hover:text-charcoal">
                                        <i className="fa-solid fa-xmark text-lg"></i>
                                    </button>
                                </div>

                                {!bookingSuccess ? (
                                    <div className="space-y-4 text-xs">
                                        <div className="flex gap-3 bg-cream p-3.5 rounded-2xl border border-soft-gray">
                                            <img src={selectedExp.image} className="w-16 h-16 object-cover rounded-xl" />
                                            <div>
                                                <h4 className="font-bold text-charcoal">{lang === 'zh' ? selectedExp.titleZh : selectedExp.title}</h4>
                                                <p className="text-coral font-extrabold mt-1">¥{selectedExp.price} / 人</p>
                                            </div>
                                        </div>

                                        <div>
                                            <label className="font-bold text-charcoal/70 block mb-1">{lang === 'zh' ? '选择预约日期' : 'Date'}</label>
                                            <input type="date" defaultValue="2026-11-10" className="w-full border rounded-xl p-3 bg-cream font-medium text-charcoal focus:outline-none" />
                                        </div>

                                        <button 
                                            onClick={() => setBookingSuccess(true)}
                                            className="w-full bg-coral text-white font-bold py-3.5 rounded-2xl text-xs hover:bg-coral-hover transition shadow-md"
                                        >
                                            {lang === 'zh' ? '确认并模拟组局预订' : 'Confirm & Book'}
                                        </button>
                                    </div>
                                ) : (
                                    <div className="text-center py-6 space-y-3">
                                        <div className="text-4xl">🎉</div>
                                        <h4 className="font-bold text-charcoal text-base">{lang === 'zh' ? '组局预约成功！' : 'Booking Confirmed!'}</h4>
                                        <p className="text-xs text-charcoal/60">
                                            {lang === 'zh' ? 'Cloudy 已将预约凭证保存至您的账户。期待在上海与您相遇！' : 'Your reservation has been confirmed. See you in Shanghai!'}
                                        </p>
                                        <button 
                                            onClick={() => { setSelectedExp(null); setBookingSuccess(false); }}
                                            className="bg-charcoal text-white text-xs font-bold px-6 py-2.5 rounded-xl"
                                        >
                                            {lang === 'zh' ? '完成' : 'Close'}
                                        </button>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<CloudLoopApp />);
    </script>
</body>
</html>
