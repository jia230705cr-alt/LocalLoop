                    likes: 89,
                    location: 'Shanghai • Wukang Rd',
                    time: '5 hours ago'
                }
            ]);

            useEffect(() => {
                localStorage.setItem('cloudloop_stamps', JSON.stringify(stamps));
            }, [stamps]);

            const toggleStamp = (id) => {
                setStamps(prev => prev.map(s => s.id === id ? { ...s, unlocked: !s.unlocked } : s));
            };

            const addPost = (newPost) => {
                setPosts([newPost, ...posts]);
            };

            return (
                <AppContext.Provider value={{ lang, setLang, stamps, toggleStamp, experiences: sampleExperiences, posts, addPost }}>
                    {children}
                </AppContext.Provider>
            );
        }

                    {/* 列表 */}
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                        {filtered.map((exp) => (
                            <div key={exp.id} onClick={() => navigate(`/experiences/${exp.id}`)} className="bg-white rounded-2xl overflow-hidden border border-warm-yellow/30 card-shadow hover:-translate-y-1 transition cursor-pointer flex flex-col justify-between">
                                <div>
                                    <img src={exp.image} alt={exp.title} className="w-full h-48 object-cover" />
                                    <div className="p-5 space-y-2">
                                        <div className="flex justify-between items-center">
                                            <span className="text-[10px] font-bold bg-cloud-blue/20 text-dark-brown px-2 py-0.5 rounded-md">
                                                {lang === 'zh' ? exp.categoryZh : exp.category}
                                            </span>
                                            <span className="text-xs font-bold text-dark-brown/60">⏱️ {lang === 'zh' ? exp.durationZh : exp.duration}</span>
                                        </div>
                                        <h3 className="font-bold text-base text-dark-brown">{lang === 'zh' ? exp.titleZh : exp.title}</h3>
                                        <p className="text-xs text-dark-brown/60 line-clamp-2">{lang === 'zh' ? exp.descZh : exp.desc}</p>
                                    </div>
                                </div>
                                <div className="p-5 pt-0 border-t border-cream flex justify-between items-center text-xs mt-3">
                                    <span className="font-extrabold text-coral text-base">¥ {exp.price} <span className="text-[10px] text-dark-brown/40 font-normal">/人</span></span>
                                    <button className="bg-dark-brown text-cream px-3 py-1.5 rounded-lg font-bold hover:bg-coral transition">
                                        {lang === 'zh' ? '查看详情' : 'View Details'}
                                    </button>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        // --- 页面 2.5：体验详情与动态预订模态框 ---
        function ExperienceDetailPage() {
            const { id } = useParams();
            const { lang, experiences } = useApp();
            const exp = experiences.find(e => e.id === id) || experiences[0];

            const [date, setDate] = useState('2026-11-10');
            const [guests, setGuests] = useState(1);
            const [showModal, setShowModal] = useState(false);

            return (
                <div className="max-w-4xl mx-auto px-4 py-8 space-y-8">
                    <Link to="/experiences" className="text-xs font-bold text-coral hover:underline">← {lang === 'zh' ? '返回体验列表' : 'Back to Experiences'}</Link>
                    
                    <div className="bg-white rounded-3xl overflow-hidden border border-warm-yellow/40 card-shadow">
                        <img src={exp.image} alt={exp.title} className="w-full h-72 object-cover" />
                        <div className="p-6 md:p-8 space-y-6">
                            <div>
                                <span className="text-xs font-bold bg-cloud-blue/20 text-dark-brown px-3 py-1 rounded-full">
                                    {lang === 'zh' ? exp.categoryZh : exp.category}
                                </span>
                                <h1 className="text-2xl md:text-3xl font-extrabold text-dark-brown mt-2">{lang === 'zh' ? exp.titleZh : exp.title}</h1>
                                <p className="text-xs text-dark-brown/60 mt-1">📍 {lang === 'zh' ? exp.locationZh : exp.location} • ⏱️ {lang === 'zh' ? exp.durationZh : exp.duration}</p>
                            </div>

                            <div className="border-y border-cream py-4 space-y-2 text-xs text-dark-brown/80">
                                <h3 className="font-bold text-sm text-dark-brown">{lang === 'zh' ? '体验亮点与包含项目：' : 'What is included:'}</h3>
                                <ul className="list-disc pl-5 space-y-1">
                                    {(lang === 'zh' ? exp.includesZh : exp.includes).map((inc, i) => (
                                        <li key={i}>{inc}</li>
                                    ))}
                                </ul>
                            </div>

                            {/* 交互预订试算面板 */}
                            <div className="bg-cream p-5 rounded-2xl border border-warm-yellow/50 space-y-4">
                                <h3 className="font-bold text-sm text-dark-brown">{lang === 'zh' ? '选择预约选项' : 'Select Date & Guests'}</h3>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
                                    <div>
                                        <label className="block text-dark-brown/60 font-bold mb-1">{lang === 'zh' ? '预约日期' : 'Date'}</label>
                                        <input type="date" value={date} onChange={(e) => setDate(e.target.value)} className="w-full bg-white p-2.5 rounded-xl border border-dark-brown/10 font-medium" />
                                    </div>
                                    <div>
                                        <label className="block text-dark-brown/60 font-bold mb-1">{lang === 'zh' ? '参与人数' : 'Participants'}</label>
                                        <select value={guests} onChange={(e) => setGuests(Number(e.target.value))} className="w-full bg-white p-2.5 rounded-xl border border-dark-brown/10 font-medium">
                                            {[1,2,3,4,5].map(n => <option key={n} value={n}>{n} {lang === 'zh' ? '人' : 'Guest(s)'}</option>)}
                                        </select>
                                    </div>
                                </div>

                                <div className="flex justify-between items-center pt-2 border-t border-warm-yellow/30">
                                    <div>
                                        <span className="text-xs text-dark-brown/60">{lang === 'zh' ? '预订总价：' : 'Total Price:'}</span>
                                        <span className="text-xl font-extrabold text-coral ml-2">¥ {exp.price * guests}</span>
                                    </div>
                                    <button onClick={() => setShowModal(true)} className="bg-coral text-white font-bold px-6 py-2.5 rounded-xl text-xs hover:bg-coral-hover transition shadow-sm">
                                        {lang === 'zh' ? '立即模拟预订' : 'Book Now'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* 模拟预订确认 Modal */}
                    {showModal && (
                        <div className="fixed inset-0 bg-dark-brown/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-3xl p-6 max-w-sm w-full space-y-4 text-center card-shadow border border-warm-yellow/40">
                                <div className="text-4xl">🎉</div>
                                <h3 className="font-bold text-lg text-dark-brown">{lang === 'zh' ? '预订成功模拟确认' : 'Booking Simulated!'}</h3>
                                <p className="text-xs text-dark-brown/70 leading-relaxed">
                                    {lang === 'zh' 
                                        ? `感谢预约！已成功预订 ${date} 的 ${exp.titleZh} (${guests}人)。此为原型展示模式，无需真实支付。` 
                                        : `Booking confirmed for ${guests} guest(s) on ${date}. This is a demonstration modal.`}
                                </p>
                                <button onClick={() => setShowModal(false)} className="w-full bg-dark-brown text-white text-xs font-bold py-2.5 rounded-xl">
                                    {lang === 'zh' ? '关闭' : 'Close'}
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // --- 页面 3：探城地图 (City Explorer) ---
        function ExplorePage() {
            const { lang } = useApp();
            const [activeMarker, setActiveMarker] = useState(null);

            const markers = [
                { id: 1, name: 'Wukang Road', nameZh: '武康路梧桐树街区', type: 'Citywalk', descZh: '老洋房与独立咖啡馆聚集地', top: '35%', left: '40%' },
                { id: 2, name: 'Yuyuan Alley', nameZh: '豫园老街九曲桥', type: 'Food & Culture', descZh: '传统糕点与百年手工艺工坊', top: '55%', left: '60%' },
                { id: 3, name: 'The Bund', nameZh: '外滩万国建筑群', type: 'Night Walk', descZh: '经典夜景与摄影拍摄打卡点', top: '25%', left: '65%' },
            ];

            return (
                <div className="max-w-6xl mx-auto px-4 py-8 space-y-8">
                    <div>
                        <h1 className="text-3xl font-extrabold text-dark-brown">{lang === 'zh' ? '🗺️ Cloudy 的上海探索地图' : 'Shanghai City Explorer'}</h1>
                        <p className="text-xs text-dark-brown/60 mt-1">{lang === 'zh' ? '点击地图上的标记点，解锁 Cloudy 的私藏推荐路线' : 'Click markers to unlock Cloudy’s curated spots'}</p>
                    </div>

                    {/* 可交互模拟地图面板 */}
                    <div className="relative bg-warm-yellow/10 border-2 border-dashed border-warm-yellow rounded-3xl h-96 overflow-hidden card-shadow flex items-center justify-center">
                        <div className="absolute inset-0 opacity-15 bg-[radial-gradient(#493A32_1px,transparent_1px)] [background-size:20px_20px]"></div>
                        
                        <span className="absolute top-4 left-4 bg-white/80 text-[10px] font-bold text-dark-brown px-3 py-1 rounded-full border border-warm-yellow">
                            💡 {lang === 'zh' ? '模拟插画地图：点击点位图标互动' : 'Interactive Map Demo'}
                        </span>

                        {markers.map((m) => (
                            <button 
                                key={m.id}
                                onClick={() => setActiveMarker(m)}
                                style={{ top: m.top, left: m.left }}
                                className="absolute transform -translate-x-1/2 -translate-y-1/2 bg-coral text-white p-2 rounded-full shadow-lg hover:scale-125 transition group"
                            >
                                📍
                                <span className="absolute left-1/2 -translate-x-1/2 top-full mt-1 bg-dark-brown text-white text-[10px] px-2 py-0.5 rounded shadow whitespace-nowrap hidden group-hover:block">
                                    {lang === 'zh' ? m.nameZh : m.name}
                                </span>
                            </button>
                        ))}

                        {activeMarker && (
                            <div className="absolute bottom-4 left-4 right-4 bg-white p-4 rounded-2xl border border-warm-yellow shadow-xl flex justify-between items-center">
                                <div>
                                    <span className="text-[10px] bg-cloud-blue/20 font-bold px-2 py-0.5 rounded text-dark-brown">{activeMarker.type}</span>
                                    <h4 className="font-bold text-sm text-dark-brown mt-1">{lang === 'zh' ? activeMarker.nameZh : activeMarker.name}</h4>
                                    <p className="text-xs text-dark-brown/60">{activeMarker.descZh}</p>
                                </div>
                                <button onClick={() => setActiveMarker(null)} className="text-xs font-bold text-coral border border-coral px-3 py-1 rounded-lg">
                                    {lang === 'zh' ? '关闭' : 'Close'}
                                </button>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        // --- 页面 4：云游护照 (Local Passport) ---
        function PassportPage() {
            const { lang, stamps, toggleStamp } = useApp();

            return (
                <div className="max-w-4xl mx-auto px-4 py-8 space-y-8">
                    <div>
                        <h1 className="text-3xl font-extrabold text-dark-brown">{lang === 'zh' ? '📖 我的 CloudLoop 数字护照' : 'Digital Travel Passport'}</h1>
                        <p className="text-xs text-dark-brown/60 mt-1">{lang === 'zh' ? '点击印章体验解锁/加盖演示，数据实时保存在本地' : 'Click stamps to collect or toggle status (localStorage synced)'}</p>
                    </div>

                    <div className="bg-dark-brown text-cream p-8 rounded-3xl card-shadow border-4 border-warm-yellow/30 space-y-6">
                        <div className="flex justify-between items-center border-b border-white/10 pb-4">
                            <div className="flex items-center gap-3">
                                <span className="text-3xl">☁️</span>
                                <div>
                                    <h3 className="font-extrabold text-lg text-white tracking-widest">SHANGHAI EXPLORER</h3>
                                    <p className="text-[10px] text-warm-yellow">Holder: Guest Traveler</p>
                                </div>
                            </div>
                            <span className="text-xs bg-warm-yellow/20 text-warm-yellow px-3 py-1 rounded-full border border-warm-yellow/30 font-bold">
                                {stamps.filter(s => s.unlocked).length} / {stamps.length} Stamps
                            </span>
                        </div>

                        {/* 印章展示网格 */}
                        <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                            {stamps.map((s) => (
                                <div 
                                    key={s.id}
                                    onClick={() => toggleStamp(s.id)}
                                    className={`p-4 rounded-2xl border-2 border-dashed transition cursor-pointer flex flex-col items-center text-center space-y-2 ${
                                        s.unlocked 
                                            ? 'border-warm-yellow bg-white/10 text-white' 
                                            : 'border-white/10 text-cream/30'
                                    }`}
                                >
                                    <span className="text-3xl">{s.icon}</span>
                                    <span className="font-bold text-xs">{lang === 'zh' ? s.nameZh : s.name}</span>
                                    <span className="text-[10px] opacity-70">{s.unlocked ? (lang === 'zh' ? '已解锁' : 'Unlocked') : (lang === 'zh' ? '点击打卡' : 'Locked')}</span>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        // --- 页面 5：社群 (Community Page) ---
        function CommunityPage() {
            const { lang, posts, addPost } = useApp();
            const [text, setText] = useState('');

            const handlePost = (e) => {
                e.preventDefault();
                if (!text.trim()) return;
                addPost({
                    id: Date.now(),
                    author: 'You (探索者)',
                    flag: '☁️',
                    role: 'Traveler',
                    text: text,
                    textZh: text,
                    likes: 1,
                    location: 'Shanghai',
                    time: 'Just now'
                });
                setText('');
            };

            return (
                <div className="max-w-4xl mx-auto px-4 py-8 space-y-8">
                    <div>
                        <h1 className="text-3xl font-extrabold text-dark-brown">{lang === 'zh' ? '💬 云上局 Community' : 'Community Hub'}</h1>
                        <p className="text-xs text-dark-brown/60 mt-1">{lang === 'zh' ? '中外游客与本地创作者的私藏角落分享' : 'Share stories and local secret spots'}</p>
                    </div>

                    {/* 发帖框 */}
                    <form onSubmit={handlePost} className="bg-white p-4 rounded-2xl border border-warm-yellow/40 card-shadow space-y-3">
                        <textarea 
                            value={text}
                            onChange={(e) => setText(e.target.value)}
                            placeholder={lang === 'zh' ? "分享你今天在上海发现的小惊喜..." : "Share your discovery today..."}
                            className="w-full bg-cream p-3 rounded-xl border border-dark-brown/10 text-xs focus:outline-none"
                            rows="3"
                        ></textarea>
                        <div className="flex justify-between items-center">
                            <span className="text-[10px] text-dark-brown/50">📍 Shanghai Pilot</span>
                            <button type="submit" className="bg-coral text-white text-xs font-bold px-5 py-2 rounded-xl hover:bg-coral-hover transition">
                                {lang === 'zh' ? '发布帖子' : 'Post'}
                            </button>
                        </div>
                    </form>

                    {/* 帖子 Feed */}
                    <div className="space-y-4">
                        {posts.map((p) => (
                            <div key={p.id} className="bg-white p-5 rounded-2xl border border-warm-yellow/30 card-shadow space-y-2">
                                <div className="flex justify-between items-center text-xs">
                                    <span className="font-bold text-dark-brown">{p.flag} {p.author} <span className="font-normal text-dark-brown/50">({p.role})</span></span>
                                    <span className="text-dark-brown/40">{p.time}</span>
                                </div>
                                <p className="text-xs text-dark-brown/80 leading-relaxed">{lang === 'zh' ? p.textZh : p.text}</p>
                                <div className="pt-2 border-t border-cream flex justify-between items-center text-[10px] text-dark-brown/50">
                                    <span>📍 {p.location}</span>
                                    <span>❤️ {p.likes}</span>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        // --- 页面 6：关于我们 (About Us Page) ---
        function AboutPage() {
            const { lang } = useApp();
            return (
                <div className="max-w-4xl mx-auto px-4 py-8 space-y-8">
                    <div className="bg-white p-8 rounded-3xl border border-warm-yellow/40 card-shadow space-y-6">
                        <div className="flex items-center gap-4">
                            <div className="text-5xl">🕊️</div>
                            <div>
                                <h1 className="text-2xl font-extrabold text-dark-brown">Cloudy（云朵鸽）的故事</h1>
                                <p className="text-xs text-coral font-bold mt-0.5">CloudLoop 品牌领航者</p>
                            </div>
                        </div>
                        <p className="text-xs text-dark-brown/70 leading-relaxed border-t border-cream pt-4">
                            {lang === 'zh' 
                                ? '在一座热闹又普通的城市里，住着一只不太普通的小鸽子。它有着两团软绵绵的云朵翅膀，戴着小红帽。它相信，城市最有趣的地方往往不在地图最显眼的位置，而藏在一次偶然的相遇里。' 
                                ? 'Cloudy is a curious pigeon with cloud-shaped wings and a red beret, traveling through Shanghai to collect local stories and authentic experiences.'}
                        </p>
                    </div>
                </div>
            );
        }

        // --- 路由配置主入口 ---
        function MainRouter() {
            return (
                <HashRouter>
                    <div className="min-h-screen flex flex-col justify-between">
                        <div>
                            <Navbar />
                            <Routes>
                                <Route path="/" element={<HomePage />} />
                                <Route path="/experiences" element={<ExperiencesPage />} />
                                <Route path="/experiences/:id" element={<ExperienceDetailPage />} />
                                <Route path="/explore" element={<ExplorePage />} />
                                <Route path="/passport" element={<PassportPage />} />
                                <Route path="/community" element={<CommunityPage />} />
                                <Route path="/about" element={<AboutPage />} />
                            </Routes>
                        </div>
                        <Footer />
                    </div>
                </HashRouter>
            );
        }

        // 渲染页面
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(
            <AppProvider>
                <MainRouter />
            </AppProvider>
        );
    </script>
</body>
</html>
